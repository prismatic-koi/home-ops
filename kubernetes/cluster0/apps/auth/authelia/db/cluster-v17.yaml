---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-postgres-v17
  namespace: databases
spec:
  instances: 2
  env:
    - name: TZ
      value: Pacific/Auckland
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-21
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
    storageClass: longhorn
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  replicationSlots:
    highAvailability:
      enabled: true
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://postgresql/
      endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
      serverName: authelia-postgres-v17
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg-secret
          key: S3_SECRET_KEY

  # Declare initdb.owner/database/secret so CNPG's app-user reconciler targets
  # the real "authelia" role and the user-managed secret (authelia-db-secrets)
  # whose password already matches the role in PG. Without this block CNPG
  # defaults owner=app/database=app, but the cluster was originally bootstrapped
  # with owner=authelia (see commit 1b7f392fd, later commented out in 4a869d26c),
  # so the operator's -app secret (username=authelia) mismatched the defaulted
  # owner and the reconciler errored every loop with:
  #   "wrong username 'authelia' in secret, expected 'app'"
  # Pointing at a user-managed secret also stops CNPG from re-managing the
  # stale -app secret (ShouldCreateApplicationSecret becomes false), matching
  # the pattern used by miniflux/home-assistant in this repo.
  bootstrap:
    initdb:
      database: authelia
      owner: authelia
      secret:
        name: authelia-db-secrets

  # use this to recover a net-new cluster from a backup
  # bootstrap:
  #   recovery:
  #     source: authelia-db-backup-v17

  # use this to 'migrate' from an existing cnpg cluster (e.g. "postgres-v15") to the new cluster
  # bootstrap:
  #   initdb:
  #     database: authelia
  #     owner: authelia
  #     import:
  #       type: microservice
  #       databases:
  #         - authelia
  #       source:
  #         externalCluster: authelia-postgres-v17

  #   # this represents an existing cnpg cluster to migrate from (e.g. upgrading from postgres v14 to postgres v15)
  #   - name: authelia-postgres-v17
  #     connectionParameters:
  #       host: authelia-postgres-v17-rw.databases.svc.cluster.local
  #       user: postgres
  #       dbname: postgres
  #       sslmode: require
  #     password:
  #       name: cloudnative-pg-secret
  #       key: password
