---
# Default deny-all for authelia-postgres-v17 CNPG cluster pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-default-deny
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS resolution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-dns
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# Allow intra-namespace primary <-> replica replication on :5432/:8000 (instance manager)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-replication
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: authelia-postgres-v17
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: authelia-postgres-v17
---
# Allow ingress from cloudnative-pg operator on :8000 (instance manager HTTP endpoint)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-operator-ingress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
          protocol: TCP
---
# Allow ingress from auth/authelia on :5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-authelia-ingress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
      ports:
        - port: 5432
          protocol: TCP
---
# Allow egress to seaweedfs-s3 on :8333 (WAL archiving)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-seaweedfs-s3-egress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
---
# Allow Prometheus to scrape postgres_exporter metrics on :9187
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres-v17-allow-prometheus-scrape
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres-v17
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9187
          protocol: TCP
