---
# HTTPRoute for oauth2-proxy on its own subdomain.
# No ForwardAuth filter — this route must be publicly reachable for the
# Google OAuth callback and sign-in flow.
# external-dns discovers the hostname automatically via --source=gateway-httproute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  hostnames:
    - oauth.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
