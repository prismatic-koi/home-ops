---
# Traefik ForwardAuth middleware for oauth2-proxy.
#
# Points at oauth2-proxy's root endpoint which handles both auth checking and
# redirect to Google in a single request — authenticated users get a 202,
# unauthenticated users get a 302 to Google login. No errors middleware needed.
#
# Requires oauth2-proxy to be configured with:
#   upstreams = ["static://202"]
#   reverse_proxy = true
#
# Duplicate into each namespace that needs this middleware — same pattern as
# forwardauth-authelia.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
