---
# Traefik Middleware: ForwardAuth → oauth2-proxy (auth-only mode)
#
# This middleware is placed in the `monitoring` namespace because Traefik's
# Gateway API ExtensionRef filter requires the Middleware to live in the same
# namespace as the HTTPRoute that references it.
#
# If other namespaces later need oauth2-proxy gating, duplicate this resource
# into those namespaces (same pattern as forwardauth-authelia).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    # The /auth endpoint returns 200 (pass) or 302 (redirect to Google login).
    # It does NOT proxy the request body, which is what keeps long-running
    # upstream connections alive — Traefik holds the connection open while
    # this lightweight auth check completes in milliseconds.
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/_auth/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
