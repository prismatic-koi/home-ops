---
# Traefik ForwardAuth middleware for oauth2-proxy.
#
# /oauth2/auth returns 202 (authenticated) or 401 (not authenticated).
# The errors middleware below catches the 401 and redirects the browser
# to oauth2-proxy's sign_in page, which issues the Google OAuth redirect.
# This avoids CSRF issues caused by calling /sign_in directly from ForwardAuth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
# Catches 401 from forwardauth-oauth2-proxy and redirects the browser to
# the oauth2-proxy sign-in page, which then initiates the Google OAuth flow.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: errors-oauth2-proxy
  namespace: monitoring
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy
      namespace: auth
      port: 4180
    query: /oauth2/sign_in?rd={url}
