---
# Traefik ForwardAuth middleware for oauth2-proxy.
#
# On an unauthenticated request, oauth2-proxy returns a 302 to Google login.
# After Google authenticates the user it redirects to oauth.domain/oauth2/callback
# which sets the session cookie, then sends the browser back to the original URL.
#
# Duplicate into each namespace that needs this middleware — same pattern as
# forwardauth-authelia.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
