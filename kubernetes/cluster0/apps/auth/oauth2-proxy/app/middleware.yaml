---
# Traefik Middleware: ForwardAuth → oauth2-proxy (auth-only mode)
#
# This middleware is placed in the `monitoring` namespace because Traefik's
# Gateway API ExtensionRef filter requires the Middleware to live in the same
# namespace as the HTTPRoute that references it.
#
# If other namespaces later need oauth2-proxy gating, duplicate this resource
# into those namespaces (same pattern as forwardauth-authelia).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    # Point at the sign_in endpoint (not /auth) so that unauthenticated requests
    # receive a 302 redirect to Google rather than a bare 401. oauth2-proxy reads
    # X-Forwarded-Host / X-Forwarded-Uri from Traefik to build the post-auth
    # redirect_url back to the original request.
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/_auth/sign_in
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
