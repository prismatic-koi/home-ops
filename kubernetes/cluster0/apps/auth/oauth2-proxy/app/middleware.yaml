---
# Traefik ForwardAuth middleware for oauth2-proxy.
#
# /oauth2/sign_in issues a 302 to Google on unauthenticated requests.
# Traefik's ForwardAuth forwards non-2xx responses (including 3xx redirects)
# directly to the browser, so the Google login flow initiates correctly.
#
# CSRF is not an issue here because the cookie and callback are both on
# oauth.${SECRET_PUBLIC_DOMAIN}, completely separate from the application host.
#
# Duplicate into each namespace that needs this middleware — same pattern as
# forwardauth-authelia.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-oauth2-proxy
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/sign_in
    trustForwardHeader: true
    authResponseHeaders:
      - Set-Cookie
      - X-Auth-Request-User
      - X-Auth-Request-Email
