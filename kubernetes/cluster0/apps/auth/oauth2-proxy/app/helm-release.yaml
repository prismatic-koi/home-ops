---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  interval: 30m
  chart:
    spec:
      chart: oauth2-proxy
      version: 7.18.x
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: oauth2-proxy-secrets
      valuesKey: client-id
      targetPath: config.clientID
    - kind: Secret
      name: oauth2-proxy-secrets
      valuesKey: client-secret
      targetPath: config.clientSecret
    - kind: Secret
      name: oauth2-proxy-secrets
      valuesKey: cookie-secret
      targetPath: config.cookieSecret
  values:
    replicaCount: 1

    config:
      configFile: |-
        provider = "google"
        provider_display_name = "Google Workspace"
        email_domains = [ "${SECRET_PUBLIC_DOMAIN}" ]

        # Auth-only — upstream is a static 202 response; real traffic is
        # forwarded by Traefik after this proxy sets the auth verdict.
        upstreams = [ "static://202" ]

        redirect_url = "https://oauth.${SECRET_PUBLIC_DOMAIN}/oauth2/callback"

        # Pass identity headers downstream so applications can read them.
        set_xauthrequest = true
        pass_access_token = false
        pass_authorization_header = false

        # Cookie domain covers all subdomains so the session cookie works
        # across any service gated by this proxy in future.
        cookie_secure = true
        cookie_httponly = true
        cookie_samesite = "lax"
        cookie_domains = [ ".${SECRET_PUBLIC_DOMAIN}" ]
        whitelist_domains = [ ".${SECRET_PUBLIC_DOMAIN}" ]

        # Trust Traefik's forwarded headers for correct redirect behaviour.
        reverse_proxy = true

        skip_provider_button = true

    service:
      type: ClusterIP
      portNumber: 4180

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    podAnnotations:
      reloader.stakater.com/auto: "true"
