---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-blocky-valkey
  namespace: flux-system
spec:
  path: ./kubernetes/cluster0/apps/networking/blocky/valkey
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-cluster0
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: blocky-valkey
      namespace: networking
  interval: 30m
  retryInterval: 1m
  timeout: 3m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-blocky
  namespace: flux-system
spec:
  path: ./kubernetes/cluster0/apps/networking/blocky/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-cluster0
  dependsOn:
    - name: cluster-apps-blocky-valkey
    # The wildcard cert Secret (${SECRET_PUBLIC_DOMAIN/./-}-tls) for the DoT
    # listener (#3564) must exist before the blocky pod starts, or blocky
    # sits in ContainerCreating on a cold rebuild waiting for the mount.
    - name: cluster-apps-traefik-certificates
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: blocky
      namespace: networking
  interval: 30m
  retryInterval: 1m
  timeout: 3m

