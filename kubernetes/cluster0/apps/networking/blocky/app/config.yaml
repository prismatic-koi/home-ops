apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  namespace: networking
data:
  config.yml: |-
    ---
    ports:
      dns: 0.0.0.0:53
      http: 0.0.0.0:4000

    log:
      level: info

    bootstrapDns:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:1.0.0.1:853
      - tcp-tls:9.9.9.9:853
      - tcp-tls:8.8.8.8:853

    # https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-tls/#how-it-works
    upstreams:
      strategy: parallel_best
      groups:
        default:
          - tcp-tls:one.one.one.one:853
          - tcp-tls:dns.quad9.net:853

    # No customDNS block. There are no pins left, and NO HOSTNAME RESOLVES ON
    # THE LAN (#3724, parent #3718). The `auth` pin was the last one; wave F
    # deleted authelia, so the name it answered no longer exists. `unifi` lost
    # its pin in wave E (#3722).
    #
    # The break-glass path is `kubectl port-forward`, which needs a working
    # kubeconfig and no name resolution at all:
    #   kubectl -n networking port-forward svc/traefik-dashboard 8080:80
    #   kubectl -n longhorn-system port-forward svc/longhorn-frontend 8081:80
    #   kubectl -n kube-system port-forward svc/hubble-ui 8082:80
    # A selectorless external-service route has no pod to attach to, so this
    # does not work for `unifi` or `nas0` -- browse those boxes directly on the
    # LAN at UNIFI_IP and NAS0_IP.
    #
    # A pin here is break-glass bootstrap for critical infrastructure only --
    # the set of names you need to repair a broken cluster. It is not a general
    # LAN fallback. An ordinary application is reached through the tailnet, and
    # the headscale ACL is its access control; a pin would widen access to the
    # whole LAN, a wider set than that ACL admits (#3629, #3617). Before you
    # add one back, confirm the hostname names an infrastructure tool AND that
    # its route binds the public websecure listener, whose address a pin can
    # name. No route on the tailnet-only websecurets listener has a LAN address
    # for a pin to point at.

    blocking:
      loading:
        # "fast": serve DNS immediately on startup; blocklists load in the
        # background and blocking enables once ready. See issue #3342.
        strategy: fast
        # Tolerate a slow/dead source instead of blocking/crashing startup.
        downloads:
          timeout: 30s
          attempts: 3
          cooldown: 10s
        # Don't fail a whole source over a handful of bad lines.
        maxErrorsPerSource: 5
      denylists:
        suspicious:
          - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
          - https://v.firebog.net/hosts/static/w3kbl.txt
        ads:
          - https://adaway.org/hosts.txt
          - https://v.firebog.net/hosts/AdguardDNS.txt
          - https://v.firebog.net/hosts/Admiral.txt
          - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
          - https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt
          - https://v.firebog.net/hosts/Easylist.txt
          - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts
          - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts
        trackers:
          - https://v.firebog.net/hosts/Easyprivacy.txt
          - https://v.firebog.net/hosts/Prigent-Ads.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts
          - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
          - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
        misc:
          - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
          - https://osint.digitalside.it/Threat-Intel/lists/latestdomains.txt
          - https://s3.amazonaws.com/lists.disconnect.me/simple_malvertising.txt
          - https://v.firebog.net/hosts/Prigent-Crypto.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts
          - https://phishing.army/download/phishing_army_blocklist_extended.txt
          - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
          - https://v.firebog.net/hosts/RPiList-Malware.txt
          - https://v.firebog.net/hosts/RPiList-Phishing.txt
          - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
          - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
      allowlists:
        suspicious:
          - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
        ads:
          - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
        trackers:
          - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
        misc:
          - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
      clientGroupsBlock:
        default:
          - suspicious
          - ads
          - trackers
          - misc

    caching:
      minTime: 5m
      prefetching: true

    redis:
      required: true
      address: blocky-valkey:6379
      username: default
      password: ${BLOCKY_VALKEY_PASSWORD}

    prometheus:
      enable: true
      path: /metrics

