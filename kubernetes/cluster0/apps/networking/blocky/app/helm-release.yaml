---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app blocky
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 10m
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  maxHistory: 3
  values:
    controllers:
      blocky:
        replicas: 2
        annotations:
          # Without this, blocky serves an EXPIRED cert about 90 days after the
          # DoT listener goes live (#3564).
          #
          # blocky reads the key pair once, at startup: newTLSConfig builds a
          # tls.Config with a fixed Certificates slice and no GetCertificate
          # callback. cert-manager rewrites the wildcard Secret at about day 60
          # of a 90-day Let's Encrypt lifetime, and nothing else here rolls the
          # pods -- blocky-config is a fixed-name ConfigMap, so the PodSpec does
          # not change, and the reloader chart default autoReloadAll is false.
          # Android Private DNS validates strictly and fails closed, so a stale
          # cert costs the device DNS on every network.
          #
          # Also closes a pre-existing gap: a config.yaml edit alone did not
          # roll blocky either. Safe with the RollingUpdate settings below --
          # unavailable "0" and surge 1 keep one replica serving throughout.
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        rollingUpdate:
          # Quoted "0": app-template's chart template uses `with .unavailable`,
          # and Go templates treat the bare int 0 as falsy, silently dropping
          # maxUnavailable from the rendered manifest. A quoted string survives
          # `with`. See issue #3342 (zero-downtime DNS rollout requires this).
          unavailable: "0"
          surge: 1
        pod:
          securityContext:
            # Required for the wildcard-tls mount below, not cosmetic.
            #
            # The blocky image runs as UID 100 with no group (OCI config
            # User: "100", scratch base, no /etc/passwd). Kubernetes writes a
            # secret volume root:root and only sets the group to fsGroup when
            # fsGroup is set. Without this, UID 100 cannot read the key at any
            # mode that is not world-readable, tls.LoadX509KeyPair fails,
            # blocky exits, and LAN DNS goes down on both replicas.
            #
            # fsGroup 100 plus defaultMode 0440 keeps the private key
            # group-readable only. Kubernetes always adds fsGroup to the
            # process supplementary groups, so this does not depend on how the
            # runtime resolves the GID of a numeric-only image user.
            # fsGroupChangePolicy is deliberately omitted: the Kubernetes
            # field has no effect on secret / configMap volumes, and blocky
            # has no PVC.
            fsGroup: 100
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
            resources:
              requests:
                cpu: 50m
                memory: 200Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 53
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  # Unauthenticated HTTP endpoint that is 200 as soon as blocky is
                  # serving (independent of blocklist loading, which runs in the
                  # background thanks to blocking.loading.strategy: fast).
                  httpGet:
                    path: /metrics
                    port: 4000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: 4000
      dns:
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Local # Important for UDP to preserve source IP
        annotations:
          io.cilium/lb-ipam-ips: ${PRIMARY_DNS_IP},${SECONDARY_DNS_IP}
        ports:
          dns-tcp:
            port: *port
            protocol: TCP
          dns-udp:
            port: *port
            protocol: UDP
      # DNS-over-TLS (#3564). Deliberately a separate ClusterIP Service, NOT a
      # port on the LoadBalancer above: the umbrella issue requires DoT to be
      # tailnet-only and NOT LAN-exposed on 853. The only in-cluster consumer
      # is tailscale-proxy-blocky, which dials
      # blocky-dot.networking.svc.cluster.local:853; Cilium socket-LB then
      # translates the ClusterIP to a blocky PodIP. A ClusterIP Service gets no
      # LB frontend, so :853 never appears on any announced LAN IP.
      dot:
        controller: *app
        type: ClusterIP
        ports:
          dot:
            port: 853
            protocol: TCP
    serviceMonitor:
      main:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      config:
        enabled: true
        type: configMap
        name: blocky-config
        globalMounts:
          - path: /app/config.yml
            subPath: config.yml
            readOnly: true
      # Wildcard cert for the DoT listener (#3564). Same namespace as blocky,
      # so no cross-namespace copy: cert-manager issues it into networking via
      # networking/traefik/certificates/certificates.yaml. The one-label DoT
      # hostname dns.${SECRET_PUBLIC_DOMAIN} is covered by the
      # *.${SECRET_PUBLIC_DOMAIN} SAN.
      #
      # Read the fsGroup comment on the controller above before changing
      # defaultMode. 0400 does NOT work here.
      wildcard-tls:
        type: secret
        name: ${SECRET_PUBLIC_DOMAIN/./-}-tls
        defaultMode: 0440
        globalMounts:
          - path: /etc/ssl/wildcard
            readOnly: true
