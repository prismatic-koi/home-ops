---
# =============================================================================
# blocky-tailnet RBAC
#
# Per-pod ServiceAccount so this tailnet node has its own kube identity and
# its own state Secret. Mirrors tailscale-proxy-blocky-rbac.yaml. Issue #3576.
#
# The state Secret name (blocky-tailnet-state) is pinned in the Role's
# resourceNames and matches TS_KUBE_SECRET in the Deployment. The `create`
# verb is granted on the whole `secrets` resource because Kubernetes RBAC does
# not allow resourceNames on `create`: the object does not exist yet at create
# time.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blocky-tailnet
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blocky-tailnet
  namespace: networking
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["blocky-tailnet-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blocky-tailnet
  namespace: networking
subjects:
  - kind: ServiceAccount
    name: blocky-tailnet
    namespace: networking
roleRef:
  kind: Role
  name: blocky-tailnet
  apiGroup: rbac.authorization.k8s.io
