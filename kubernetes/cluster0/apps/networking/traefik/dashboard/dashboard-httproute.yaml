---
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: networking
spec:
  selector:
    app.kubernetes.io/instance: traefik-networking
    app.kubernetes.io/name: traefik
  type: ClusterIP
  ports:
  - name: dashboard
    protocol: TCP
    port: 80
    targetPort: 8080
---
# switch to httproute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 3
    # (#3635): the websecurets listener serves it and nothing else does.
    # external-dns does not own this record, so "false" is inert for it and
    # only a manual Cloudflare delete withdraws the record (#3607). The
    # headscale split entry and the extra_records pin (#3677) are a pair, and
    # together they are the only resolution path for this hostname. There is
    # no blocky customDNS pin. Remove either half and no client resolves it.
    dns.home-ops/public: "false"
    # Exposure tier (#3734). Tier 3 = tailnet-only (websecurets). This label
    # and the parentRefs sectionName must agree; the lint enforces it.
    exposure.home-ops/tier: "3"
spec:
  hostnames: 
  - "traefik.${SECRET_PUBLIC_DOMAIN}"
  parentRefs:
    # Tailnet-only (#3635): the websecurets listener alone. websecurets sits
    # behind traefik-ts, a ClusterIP Service with no LAN address, so the ts-web
    # tailnet proxy is the only path to this route. The public websecure
    # listener holds no route for this hostname, so a request to the public
    # address returns 404. The LAN tier was retired (#3718, #3723), so kubectl
    # port-forward is the break-glass path. A websecure entry restores public
    # reachability -- restore the forwardauth-authelia filter first.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  # NO forwardauth-authelia middleware on either rule. Access control is the
  # headscale ACL grant (ben@ -> tag:ts-web tcp:443 in policy.hujson), because
  # the ts-web tailnet proxy is the only path to this route. The traefik
  # dashboard has no authentication of its own and its /api rule exposes the
  # whole routing table, so restore the filter on BOTH rules before you bind
  # this route to a listener that has a LAN or a public address.
  rules:
  - matches:
      - path:
          type: PathPrefix
          value: /api
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
  - matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /dashboard/
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
