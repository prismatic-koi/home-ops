---
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: networking
spec:
  selector:
    app.kubernetes.io/instance: traefik-networking
    app.kubernetes.io/name: traefik
  type: ClusterIP
  ports:
  - name: dashboard
    protocol: TCP
    port: 80
    targetPort: 8080
---
# switch to httproute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 2
    # (#3635): reachable from the LAN and the tailnet, not from the internet.
    # A tier-2 route is LAN-reachable by design, so the forwardauth-authelia
    # filter below is its identity control and stays permanently.
    # external-dns does not own this record, so "false" is inert for it and
    # the record needs a manual Cloudflare delete (#3607). A LAN client
    # resolves the hostname through the blocky customDNS pin; a tailnet client
    # through the headscale split entry and extra_records pin (#3677).
    dns.home-ops/public: "false"
spec:
  hostnames: 
  - "traefik.${SECRET_PUBLIC_DOMAIN}"
  parentRefs:
    # Tier 2 (#3635, #3678): the LAN and tailnet listeners only. The public
    # websecure listener holds no route for this hostname, so a request to the
    # public address returns 404. Both entries are load-bearing -- the LAN one
    # when tailscale is down, the tailnet one when the operator is off-LAN.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurelan
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  rules:
  - matches:
      - path:
          type: PathPrefix
          value: /api
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: forwardauth-authelia
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
  - matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /dashboard/
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: forwardauth-authelia
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
