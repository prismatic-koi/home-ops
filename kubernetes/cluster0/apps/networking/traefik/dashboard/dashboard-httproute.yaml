---
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: networking
spec:
  selector:
    app.kubernetes.io/instance: traefik-networking
    app.kubernetes.io/name: traefik
  type: ClusterIP
  ports:
  - name: dashboard
    protocol: TCP
    port: 80
    targetPort: 8080
---
# switch to httproute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: networking
  labels:
    # Public DNS opt-in (#3518). Removing this withdraws public DNS for the
    # hostname — pair it with internal resolution. See AGENTS.md.
    dns.home-ops/public: "true"
spec:
  hostnames: 
  - "traefik.${SECRET_PUBLIC_DOMAIN}"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
    # Tier-2 phase 1 (#3672): add LAN and tailnet listener paths alongside
    # the existing public one. Additive; no client behaviour changes yet.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurelan
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  rules:
  - matches:
      - path:
          type: PathPrefix
          value: /api
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: forwardauth-authelia
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
  - matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /dashboard/
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: forwardauth-authelia
    backendRefs:
      - group: ""
        kind: Service
        name: traefik-dashboard
        namespace: networking
        port: 80
