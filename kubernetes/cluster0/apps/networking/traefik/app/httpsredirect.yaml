---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpsredirect
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. This route declares no
    # hostnames, so it can never produce a DNS record; the lint exempts a
    # no-hostname route either way. The label states the decision explicitly.
    dns.home-ops/public: "false"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: networking
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
