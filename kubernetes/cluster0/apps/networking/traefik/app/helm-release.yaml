---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: 41.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deployment:
      enabled: true
      replicas: 3
    service:
      enabled: true
      annotations:
        io.cilium/lb-ipam-ips: ${TRAEFIK_IP}
      spec:
        type: LoadBalancer
    tlsStore:
      default:
        defaultCertificate:
          secretName: "${SECRET_PUBLIC_DOMAIN/./-}-tls"
    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true
    # experimental:
    #   plugins:
    #     enabled: true
    rbac:
      enabled: true
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        allowExternalNameServices: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
      kubernetesGateway:
        enabled: true
    gateway:
      annotations:
        external-dns.alpha.kubernetes.io/target: &hostname "ipv4.${SECRET_PUBLIC_DOMAIN}"
      infrastructure:
        annotations:
            external-dns.alpha.kubernetes.io/hostname: *hostname
      listeners:
        web:
          port: 80
          protocol: HTTP
          namespacePolicy: 
            from: All
        websecure:
          port: 443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - kind: Secret
              name: "${SECRET_PUBLIC_DOMAIN/./-}-tls"
            # Second cert for the tailnet-only web UIs (*.ts.<domain>, #3466).
            # Traefik selects the listener cert by SNI, so both the base
            # wildcard and this ts. wildcard are served side by side.
            - kind: Secret
              name: "ts-${SECRET_PUBLIC_DOMAIN/./-}-tls"
        # Tier-2 LAN listener (#3617, renamed #3654). Clients reach it on port
        # 443 at TRAEFIK_LAN_IP, through the standalone traefik-lan Service.
        # The LAN router forwards no port to that address, so the listener is
        # not reachable from the internet.
        #
        # The chart renders listeners in key order. This name sorts after
        # websecure, so the two public listeners keep their index.
        #
        # certificateRefs and namespacePolicy are identical to websecure, so a
        # route serves the same certificates on either listener.
        websecurelan:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - kind: Secret
              name: "${SECRET_PUBLIC_DOMAIN/./-}-tls"
            - kind: Secret
              name: "ts-${SECRET_PUBLIC_DOMAIN/./-}-tls"
        # Tailnet-only listener, tier 3 (#3635, #3636). The only Service in
        # front of it is traefik-ts, which is ClusterIP. No LoadBalancer
        # address exists for this listener, so a route bound here is
        # reachable from inside the cluster only. Step 3 of #3635 repoints
        # the ts-web proxy at traefik-ts, which makes that the tailnet path.
        #
        # The chart renders listeners in key order. This name sorts after
        # websecurelan, so web, websecure and websecurelan keep their index.
        #
        # certificateRefs and namespacePolicy are identical to websecure and
        # websecurelan, so a route serves the same certificates on any of the
        # three listeners.
        websecurets:
          port: 9443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - kind: Secret
              name: "${SECRET_PUBLIC_DOMAIN/./-}-tls"
            - kind: Secret
              name: "ts-${SECRET_PUBLIC_DOMAIN/./-}-tls"
    additionalArguments:
      - "--api.insecure=true"
      - "--providers.kubernetesingress.ingressclass=traefik"
      - "--providers.kubernetesingress.ingressendpoint.ip=${TRAEFIK_IP}"
      - "--providers.kubernetescrd.allowexternalnameservices=true"
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 443
        exposedPort: 443
        http:
          tls:
            enabled: true
            options: "default"
      # Entrypoint for the tier-2 LAN Gateway listener (#3617, renamed #3654).
      # The container port must differ from 443: one pod serves both listeners.
      #
      # expose.default must stay false. A true value adds :8443 to the
      # chart-managed Service, which publishes the LAN listener on the
      # public address.
      websecurelan:
        port: 8443
        expose:
          default: false
        http:
          tls:
            enabled: true
            options: "default"
      # Entrypoint for the tailnet-only Gateway listener, tier 3 (#3636). The
      # container port must differ from 443 and from the tier-2 8443: one pod
      # serves all three listeners.
      # serves all three listeners.
      #
      # expose.default must stay false. A true value adds :9443 to the
      # chart-managed Service, which publishes the tailnet-only listener on the
      # public address.
      websecurets:
        port: 9443
        expose:
          default: false
        http:
          tls:
            enabled: true
            options: "default"
    log:
      level: "INFO"
    accessLog:
      enabled: true
