---
apiVersion: v1
kind: Service
metadata:
  name: octoprint
  namespace: networking
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: octoprint
  namespace: networking
  labels:
    kubernetes.io/service-name: octoprint
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${OCTOPRINT_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octoprint
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. Withdrawn from public DNS
    # in #3610: access is tailnet-only by intent. The headscale split
    # entry plus the extra_records pin (#3609) are the resolution path for a
    # tailnet client. This hostname gets no blocky customDNS pin: #3631 removed
    # it, because a pin is break-glass bootstrap for infrastructure only
    # (#3629).
    dns.home-ops/public: "false"
spec:
  # Tier-3 (websecurets) listener only (#3648, step 4 of #3635). The route left
  # the tier-2 websecurelan listener, so the traefik-lan LAN address no
  # longer serves this hostname. websecurets sits behind traefik-ts, a
  # ClusterIP Service with no LAN address, so the ts-web tailnet proxy is the
  # only path to this hostname. The public websecure listener serves no route
  # for it either, so a request to the public address returns 404 whatever the
  # client resolves. A websecurelan entry restores the LAN path; a websecure
  # entry restores public reachability.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["octoprint.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: octoprint
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
