---
apiVersion: v1
kind: Service
metadata:
  name: octoprint
  namespace: networking
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: octoprint
  namespace: networking
  labels:
    kubernetes.io/service-name: octoprint
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${OCTOPRINT_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octoprint
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. Withdrawn from public DNS
    # in #3610: off-LAN access is tailnet-only by intent. Internal resolution
    # stands in place of the public record — the headscale split entry plus
    # extra_records pin (#3609) for a tailnet client, and the blocky customDNS
    # pin (#3609) for a LAN client that is not on the tailnet. Both must stay,
    # or the hostname stops resolving everywhere.
    dns.home-ops/public: "false"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurepriv
  hostnames: ["octoprint.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: octoprint
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
