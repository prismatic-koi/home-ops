---
apiVersion: v1
kind: Service
metadata:
  name: octoprint
  namespace: networking
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: octoprint
  namespace: networking
  labels:
    kubernetes.io/service-name: octoprint
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${OCTOPRINT_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octoprint
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. Withdrawn from public DNS
    # in #3610: off-LAN access is tailnet-only by intent. The headscale split
    # entry plus the extra_records pin (#3609) are the resolution path for a
    # tailnet client. This hostname gets no blocky customDNS pin: #3631 removed
    # it, because a pin is break-glass bootstrap for infrastructure only
    # (#3629).
    dns.home-ops/public: "false"
spec:
  # Tier-2 (websecurepriv) and tier-3 (websecurets) listeners, dual-bound
  # (#3643, step 2 of #3635). The public websecure listener serves no route for
  # this hostname, so a request to the public address returns 404 whatever the
  # client resolves. The route is reachable from the LAN (the traefik-private
  # address) and from the tailnet (the ts-web proxy), but not from the
  # internet. It becomes tier-3 tailnet-only when step 4 unbinds websecurepriv.
  # A websecure entry restores public reachability.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurepriv
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["octoprint.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: octoprint
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
