---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: networking
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unifi
  namespace: networking
  labels:
    kubernetes.io/service-name: unifi
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${UNIFI_IP}"
  conditions:
    ready: true
ports:
- name: https
  port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unifi-tls
  namespace: networking
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: unifi
  validation:
    hostname: unifi.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: unifi-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 3
    # (#3722, parent #3718): the websecurets listener serves it and nothing
    # else does. The headscale split entry and the extra_records pin are a
    # pair, and together they are the only resolution path that reaches this
    # service. There is no blocky customDNS pin -- wave E removed it. Remove
    # either half of the pair and no client reaches it. external-dns holds no
    # ownership TXT for this hostname under either naming scheme (k8s.unifi
    # and k8s.cname-unifi both absent), so "false" is inert for it: the
    # public CNAME stays in Cloudflare until someone deletes it by hand. The
    # public address answers 404 meanwhile, because no route names the
    # websecure listener. The break-glass path is direct: browse the physical
    # UniFi controller at https://UNIFI_IP on the LAN -- no cluster, no DNS.
    dns.home-ops/public: "false"
    # Exposure tier (#3734). Tier 3 = tailnet-only (websecurets). This label
    # and the parentRefs sectionName must agree; the lint enforces it.
    exposure.home-ops/tier: "3"
spec:
  parentRefs:
    # Tailnet-only (#3635): the websecurets listener alone. websecurets sits
    # behind traefik-ts, a ClusterIP Service with no LAN address, so the ts-web
    # tailnet proxy is the only in-cluster path to this route. The public
    # websecure listener holds no route for this hostname, so a request to the
    # public address returns 404. The LAN tier was retired (#3718, #3723).
    # This route proxies to the physical UniFi
    # controller at UNIFI_IP, so its break-glass path is not kubectl
    # port-forward (the Service is selectorless and has no pod) but a direct
    # LAN browse to that controller address (#3722).
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["unifi.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: unifi
        namespace: networking
        port: 443
    matches:
    - path:
        type: PathPrefix
        value: /
