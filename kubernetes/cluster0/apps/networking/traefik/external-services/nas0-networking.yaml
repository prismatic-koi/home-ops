---
apiVersion: v1
kind: Service
metadata:
  name: nas0
  namespace: networking
spec:
  ports:
  - name: http
    port: 80
    targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas0
  namespace: networking
  labels:
    kubernetes.io/service-name: nas0
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${NAS0_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas0
  namespace: networking
  labels:
    # Public DNS opt-in (#3518). Removing this withdraws public DNS for the
    # hostname — pair it with internal resolution. See AGENTS.md.
    dns.home-ops/public: "true"
spec:
  parentRefs:
    # Expand phase of #3721 (wave D of #3718). websecurets is added beside
    # the public listener, so the tailnet path is live before the next
    # commit removes websecure. #3522 records the outage that follows when
    # those two steps collapse into one.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["nas0.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: nas0
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
