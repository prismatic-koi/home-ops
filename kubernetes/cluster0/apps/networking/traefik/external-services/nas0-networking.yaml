---
apiVersion: v1
kind: Service
metadata:
  name: nas0
  namespace: networking
spec:
  ports:
  - name: http
    port: 80
    targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas0
  namespace: networking
  labels:
    kubernetes.io/service-name: nas0
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${NAS0_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas0
  namespace: networking
  labels:
    # Public DNS opt-in (#3518). Removing this withdraws public DNS for the
    # hostname — pair it with internal resolution. See AGENTS.md.
    dns.home-ops/public: "true"
spec:
  parentRefs:
    # Tier 3 (#3635): the websecurets listener alone. websecurets sits behind
    # traefik-ts, a ClusterIP Service with no LAN address, so the ts-web
    # tailnet proxy is the only path to this route. Neither the public
    # websecure listener nor the LAN websecurelan listener holds a route for
    # this hostname, so a request to either address returns 404. Tier 2
    # holds no route, and kubectl port-forward is the break-glass path
    # (#3718).
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["nas0.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: nas0
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
