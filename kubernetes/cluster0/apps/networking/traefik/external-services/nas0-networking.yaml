---
apiVersion: v1
kind: Service
metadata:
  name: nas0
  namespace: networking
spec:
  ports:
  - name: http
    port: 80
    targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas0
  namespace: networking
  labels:
    kubernetes.io/service-name: nas0
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
endpoints:
- addresses:
  - "${NAS0_IP}"
  conditions:
    ready: true
ports:
- name: http
  port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas0
  namespace: networking
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 3
    # (#3721, parent #3718): the websecurets listener serves it and nothing
    # else does. The headscale split entry and the extra_records pin are a
    # pair, and together they are the only resolution path that reaches this
    # service. There is no blocky customDNS pin. Remove either half and no
    # client reaches it. external-dns holds no ownership TXT for this
    # hostname under either naming scheme, so "false" is inert for it: the
    # public CNAME stays in Cloudflare until someone deletes it by hand. The
    # public address answers 404 meanwhile, because no route names the
    # websecure listener.
    dns.home-ops/public: "false"
    # Exposure tier (#3734). Tier 3 = tailnet-only (websecurets). This label
    # and the parentRefs sectionName must agree; the lint enforces it.
    exposure.home-ops/tier: "3"
spec:
  parentRefs:
    # Tailnet-only (#3635): the websecurets listener alone. websecurets sits
    # behind traefik-ts, a ClusterIP Service with no LAN address, so the ts-web
    # tailnet proxy is the only path to this route. The public websecure
    # listener holds no route for this hostname, so a request to the public
    # address returns 404. The LAN tier was retired (#3718, #3723), so kubectl
    # port-forward is the break-glass path.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  hostnames: ["nas0.${SECRET_PUBLIC_DOMAIN}"]
  rules:
  - backendRefs:
      - group: ""
        kind: Service
        name: nas0
        namespace: networking
        port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
