apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale
  namespace: networking
spec:
  serviceName: headscale
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
      annotations:
        # headscale-config / headscale-policy are mounted via subPath, which
        # Kubernetes never updates in place -- without Reloader, edits to
        # either ConfigMap silently no-op until someone manually restarts
        # the pod. See #3370.
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: headscale
          image: ghcr.io/juanfont/headscale:0.29.2
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /etc/headscale/policy.hujson
              subPath: policy.hujson
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: policy
          configMap:
            name: headscale-policy
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
