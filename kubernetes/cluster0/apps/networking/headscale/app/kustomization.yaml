---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-release.yaml
  - ./httproute.yaml
  - ./servicemonitor.yaml
  - ./network-policy.yaml
  # Per-service tailscale proxies (design #3377, issue #3378). Superseded
  # the retired in-cluster subnet router (removed in #3379); each proxy
  # terminates the inbound tailnet TCP and re-originates a fresh outbound
  # socket to its target Service so Cilium socket-LB translates ClusterIP
  # correctly (root cause: #3377).
  - ./tailscale-proxy-prometheus-rbac.yaml
  - ./tailscale-proxy-prometheus-secret.sops.yaml
  - ./tailscale-proxy-prometheus-deployment.yaml
  - ./tailscale-proxy-prometheus-network-policy.yaml
  - ./tailscale-proxy-loki-rbac.yaml
  - ./tailscale-proxy-loki-secret.sops.yaml
  - ./tailscale-proxy-loki-deployment.yaml
  - ./tailscale-proxy-loki-network-policy.yaml
  # Fleet-metrics remote_write ingest proxy (issue #3386). Additive:
  # exposes the dedicated single-replica fleet-ingest Prometheus to the
  # tailnet as tag:ts-metrics-ingest. Independent of the HA-pair proxy above.
  - ./tailscale-proxy-metrics-ingest-rbac.yaml
  - ./tailscale-proxy-metrics-ingest-secret.sops.yaml
  - ./tailscale-proxy-metrics-ingest-deployment.yaml
  - ./tailscale-proxy-metrics-ingest-network-policy.yaml
  # Shared tailnet-only web-UI proxy (pilot #3466). One ts-web node fronts
  # every *.ts.<domain> web UI; TCPForwards :443 to the traefik gateway,
  # which terminates TLS and routes by hostname. First consumer:
  # prometheus.ts.<domain> (HTTPRoute in monitoring/kube-prometheus-stack).
  - ./tailscale-proxy-ts-web-rbac.yaml
  # Preauth-key Secret: created + SOPS-encrypted by the operator and landed on
  # main via #3468 (tagged tag:ts-web). Referenced here so the ts-web proxy
  # Deployment can mount TS_AUTHKEY.
  - ./tailscale-proxy-ts-web-secret.sops.yaml
  - ./tailscale-proxy-ts-web-deployment.yaml
  - ./tailscale-proxy-ts-web-network-policy.yaml
  # DNS-over-TLS proxy for blocky (#3564). Tailnet-only: TCPForwards :853 to
  # the in-cluster blocky-dns Service, and blocky terminates DoT on the
  # existing *.<domain> wildcard cert. Its consumer is Android Private DNS,
  # which takes one hostname and uses DoT everywhere -- so it needs an L4
  # pipe, not ts-web (which exists to hand HTTPS to traefik).
  - ./tailscale-proxy-blocky-rbac.yaml
  # Preauth-key Secret: created + SOPS-encrypted by the operator, because only
  # they hold the sops key. Listed here so the kustomize path is complete; the
  # commit that adds the encrypted file is what makes this reconcile.
  # Mint the key with `headscale preauthkeys create --user homeops@ --tags
  # tag:ts-blocky --reusable`. headscale accepts a tag it does not yet know at
  # mint time, so the key can be minted before this policy is live.
  - ./tailscale-proxy-blocky-secret.sops.yaml
  - ./tailscale-proxy-blocky-deployment.yaml
  - ./tailscale-proxy-blocky-network-policy.yaml
labels:
  - pairs:
      app.kubernetes.io/name: headscale
      app.kubernetes.io/instance: headscale
configMapGenerator:
  - name: headscale-config
    namespace: networking
    files:
      - config.yaml=./config/config.yaml
  - name: headscale-policy
    namespace: networking
    files:
      - policy.hujson=./config/policy.hujson
generatorOptions:
  disableNameSuffixHash: true
