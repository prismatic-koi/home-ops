---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app headscale
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    global:
      nameOverride: *app
    controllers:
      headscale:
        type: statefulset
        replicas: 1
        annotations:
          # headscale-config / headscale-policy are mounted via subPath, which
          # Kubernetes never updates in place -- without Reloader, edits to
          # either ConfigMap silently no-op until someone manually restarts
          # the pod. See #3370.
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        statefulset:
          volumeClaimTemplates:
            - name: data
              size: 1Gi
              accessMode: ReadWriteOnce
              storageClass: longhorn
              globalMounts:
                - path: /var/lib/headscale
        containers:
          app:
            image:
              repository: ghcr.io/juanfont/headscale
              tag: "0.29.2"
            args: ["serve"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
    service:
      app:
        controller: headscale
        ports:
          http:
            port: *port
          metrics:
            port: 9091
    persistence:
      config:
        type: configMap
        name: headscale-config
        globalMounts:
          - path: /etc/headscale/config.yaml
            subPath: config.yaml
            readOnly: true
      policy:
        type: configMap
        name: headscale-policy
        globalMounts:
          - path: /etc/headscale/policy.hujson
            subPath: policy.hujson
            readOnly: true
