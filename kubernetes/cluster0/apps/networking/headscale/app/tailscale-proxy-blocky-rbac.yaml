---
# =============================================================================
# tailscale-proxy-blocky RBAC
#
# Per-proxy ServiceAccount so each tailnet node has its own kube identity
# and its own state Secret. Mirrors tailscale-proxy-prometheus-rbac.yaml.
# Issue #3564.
#
# The state Secret name (tailscale-proxy-blocky-state) is pinned in the
# Role's resourceNames, matching the TS_KUBE_SECRET env in the Deployment.
# The `create` verb is granted on the whole `secrets` resource because
# Kubernetes RBAC does not allow resourceNames on `create` (the object does
# not exist yet at create time).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-proxy-blocky
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-proxy-blocky
  namespace: networking
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-proxy-blocky-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-proxy-blocky
  namespace: networking
subjects:
  - kind: ServiceAccount
    name: tailscale-proxy-blocky
    namespace: networking
roleRef:
  kind: Role
  name: tailscale-proxy-blocky
  apiGroup: rbac.authorization.k8s.io
