---
server_url: https://hs.${SECRET_PUBLIC_DOMAIN}
listen_addr: 0.0.0.0:8080
unix_socket: /var/lib/headscale/headscale.sock
metrics_listen_addr: 0.0.0.0:9091

noise:
  private_key_path: /var/lib/headscale/noise_private.key

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  level: info

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

dns:
  magic_dns: true
  base_domain: tailnet.internal
  # true so headscale pushes the global nameserver below to every client that
  # accepts DNS, and that client resolves through it instead of its local DHCP
  # resolver (#3576). This reaches ONLY ben@ personal devices: all five
  # tailscale-proxy pods set TS_ACCEPT_DNS=false, and node0/1/2 run
  # --accept-dns=false (verified live). node3 passed --accept-dns=false in its
  # `tailscale up` invocation (#3579) -- see
  # docs/runbooks/tailnet-control-plane-access.md. That invocation is the
  # evidence. A live `tailscale debug prefs` read on node3 is still
  # outstanding. So no infrastructure inherits blocky.
  override_local_dns: true
  nameservers:
    global:
      # EXACTLY ONE entry, by design (#3576). This is the blocky-tailnet node's
      # own tailnet address (tag:ts-dns), a plain UDP/TCP resolver that runs
      # the same blocklists as the LAN blocky.
      #
      # Do NOT add a public fallback here. tailscale (v1.102.3) races every
      # plain-IP entry in parallel: resolversWithDelays() assigns startDelay 0
      # to each one and forwardWithDestChan() returns the first response. A
      # public resolver would win nearly every race and silently defeat ad
      # blocking while still looking configured.
      #
      # Accepted failure mode: if blocky-tailnet is unreachable while tailscale
      # is up, there is no DNS fallback. Recovery is to toggle tailscale off on
      # the affected device, which restores its DHCP resolver.
      - 100.64.0.14
    split:
      # =====================================================================
      # THE SINGLE MOST DANGEROUS LINE IN THE #3466 PILOT. DO NOT WIDEN IT.
      #
      # A headscale split route is a SUFFIX match. Scoped to
      # ts.${SECRET_PUBLIC_DOMAIN} it captures ONLY *.ts.<domain>. If anyone
      # ever changes the key to the bare ${SECRET_PUBLIC_DOMAIN}, the empty
      # resolver list ([]) becomes a client-side LocalDomains suffix entry
      # that returns NXDOMAIN for every name under it not pinned in
      # extra_records -- i.e. it NXDOMAINs ~20 live public app hostnames
      # (grafana, jellyfin, home-assistant, ...) for EVERY tailnet device on
      # EVERY network. grafana.${SECRET_PUBLIC_DOMAIN} is not a subdomain of
      # ts.${SECRET_PUBLIC_DOMAIN}, so with this scoping it never routes here
      # and resolves exactly as it does today. Keep it scoped to ts.
      # The empty list is deliberate: the only name that resolves under this
      # suffix is the one pinned in extra_records below.
      # =====================================================================
      ts.${SECRET_PUBLIC_DOMAIN}: []
      # searxng (#3553), expand phase. Leaf-scoped, and the block above is
      # why. The leaf key is safe because dnsname.FQDN.Contains returns true
      # on equality as well as on a dot-boundary suffix, so this entry
      # captures search.<domain> and nothing beside it.
      #
      # This entry and the search.<domain> pin in extra_records are a PAIR.
      # Drop the pin and this entry NXDOMAINs searxng for every tailnet
      # device. Drop this entry and the pin goes inert: the client builds its
      # OS match-domain list from Routes only, never from Hosts, so a pinned
      # name with no route is never sent to the tailscale resolver at all.
      search.${SECRET_PUBLIC_DOMAIN}: []
      # Wave 1 phase 1 (#3608), expand phase. Leaf-scoped for the same reason
      # as the search entry above -- each key equals its own leaf hostname,
      # never the bare domain. Paired with the extra_records pins below.
      changedetection-io.${SECRET_PUBLIC_DOMAIN}: []
      uptime.${SECRET_PUBLIC_DOMAIN}: []
      zigbee2mqtt.${SECRET_PUBLIC_DOMAIN}: []
      octoprint.${SECRET_PUBLIC_DOMAIN}: []
      # Wave 2 (#3668, parent #3607), expand phase. Leaf-scoped for the same
      # reason as the search entry above -- each key equals its own leaf
      # hostname, never the bare domain. Paired with the extra_records pins
      # below.
      seaweedfs.${SECRET_PUBLIC_DOMAIN}: []
      grafana.${SECRET_PUBLIC_DOMAIN}: []
  extra_records:
    # Pins the pilot hostname to the tailscale-proxy-ts-web node's assigned
    # tailnet IP (read from its tailscale-proxy-ts-web-state Secret:
    # device_ips=100.64.0.3 / fd7a:115c:a1e0::3, device_fqdn=
    # ts-web.tailnet.internal). This is served as a MagicDNS Hosts (exact)
    # entry, which takes precedence over the LocalDomains NXDOMAIN above.
    #
    # A-only, no AAAA -- deliberate, reasoning recorded per the phase-3 brief:
    # every tailnet node is always assigned a 100.64.0.0/10 IPv4 by tailscale
    # regardless of the client's underlying network, so a single A record
    # reaches every tailnet client. The node's ULA IPv6 (fd7a:115c:a1e0::3)
    # adds a second address family to reason about (happy-eyeballs ordering,
    # v6 reachability) for zero functional gain, since no tailnet client is
    # v4-less. The design doc and issue #3466 specify an A record only. If a
    # genuinely IPv6-only consumer ever appears, add the AAAA then -- not
    # reflexively now.
    - name: "prometheus.ts.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    # searxng (#3553), expand phase. Same ts-web IP as the pilot pin above:
    # one shared proxy fronts every tailnet web UI, so a new consumer is a
    # pin plus a split entry, not a new proxy. A-only for the reason recorded
    # above. Paired with the search.<domain> split entry -- read the note
    # there before you remove either.
    #
    # Contract phase (#3555): the public record is withdrawn. This pin is
    # visible only to a MagicDNS-enabled tailnet client, and it is now the
    # only resolution path for the hostname -- do not remove it as redundant.
    # #3631 removed the blocky customDNS pin, and #3648 moved the route to
    # the tier-3 websecurets listener, so no LAN path remains at all. See
    # AGENTS.md, "Three exposure tiers: the listener routes, the Service
    # exposes".
    - name: "search.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    # Wave 1 phase 1 (#3608), expand phase. Same shared ts-web proxy as the
    # pins above. Paired with the split entries above -- read the notes
    # there before you remove either half of any pair.
    - name: "changedetection-io.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    - name: "uptime.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    - name: "zigbee2mqtt.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    - name: "octoprint.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    # Wave 2 (#3668, parent #3607), expand phase. Same shared ts-web proxy as
    # the pins above. Paired with the split entries above -- read the notes
    # there before you remove either half of any pair.
    - name: "seaweedfs.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"
    - name: "grafana.${SECRET_PUBLIC_DOMAIN}"
      type: "A"
      value: "100.64.0.3"

policy:
  mode: file
  path: /etc/headscale/policy.hujson

