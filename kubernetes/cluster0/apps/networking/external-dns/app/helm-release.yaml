---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns-charts
        namespace: flux-system
      interval: 5m
  values:
    interval: 5m
    logLevel: debug
    provider: cloudflare
    env:
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: external-dns-cloud-credentials
            key: email
      - name: CF_API_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-cloud-credentials
            key: api-key
    # Public DNS publication is FAIL-CLOSED (#3518).
    #
    # labelFilter renders --label-filter, which makes external-dns list only
    # objects that carry the label dns.home-ops/public=true. Every other object
    # is invisible to it, so a NEW HTTPRoute gets no public A/CNAME record and
    # no `k8s.` TXT ownership record until someone deliberately adds the label.
    # See AGENTS.md, section "Public DNS is opt-in (external-dns)".
    #
    # This flag changed the MECHANISM only. Every hostname that external-dns
    # published before the flag was added carries the label, so the published
    # set did not change. The defect this fixes is fail-open publication of new
    # routes, not the size of the published set.
    #
    # The filter is applied by the informer, so an unlabelled object never
    # enters the cache. external-dns v0.21.0 documents `gateway-httproute`,
    # `crd` and `ingress` as supported sources for this flag.
    #
    # --label-filter is GLOBAL: it applies to every source enabled below, not
    # only gateway-httproute. Consequences:
    #   * A DNSEndpoint needs the label too. The repo holds no DNSEndpoint
    #     today, so the crd source publishes nothing. Add the label to the
    #     first one someone writes, or external-dns never sees it.
    #   * Any future Ingress object needs the label to publish a record.
    # Enumerate every enabled source before you change this flag. One review
    # checked gateway-httproute alone and nearly deleted a live record from the
    # crd source (#3518). That record went with the app that published it
    # (#3581). The crd and ingress sources stay enabled below, so the same
    # mistake is still available.
    #
    # `policy: sync` stays as it is, so removal of the label withdraws the
    # record on the next reconcile. Do NOT remove a label to make a service
    # private on its own: most clients here resolve app hostnames through
    # PUBLIC DNS even on the LAN, so withdrawal must be paired with internal
    # resolution for that hostname. See AGENTS.md.
    labelFilter: dns.home-ops/public=true
    extraArgs:
      # The two --crd-source-* args are RETAINED DELIBERATELY for a future
      # DNSEndpoint (#3581). With zero DNSEndpoint objects in the repo they are
      # inert; keeping them means the next one works without re-plumbing.
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --cloudflare-proxied
      - --source=gateway-httproute
    rbac:
      additionalPermissions:
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get","watch","list"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["gateways","httproutes","tlsroutes","tcproutes","udproutes"] 
          verbs: ["get","watch","list"]
    policy: sync
    sources:
      - ingress
      # Retained deliberately for a future DNSEndpoint (#3581) — see the
      # --crd-source-* args above.
      - crd
    txtPrefix: "k8s."
    txtOwnerId: "default"
    domainFilters:
      - "${SECRET_PUBLIC_DOMAIN}"
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
