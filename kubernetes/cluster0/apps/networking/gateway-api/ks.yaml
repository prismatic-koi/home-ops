---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-gateway-api
  namespace: flux-system
spec:
  path: ./kubernetes/cluster0/apps/networking/gateway-api/app
  # prune: false — deletion would cascade-delete every Gateway, HTTPRoute,
  # and BackendTLSPolicy in the cluster. Matches the prune: false posture
  # on cluster-apps-cilium.
  prune: false
  sourceRef:
    kind: GitRepository
    name: home-ops-cluster0
  interval: 30m
  retryInterval: 1m
  timeout: 3m
