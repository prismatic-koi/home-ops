---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          # do the torrent thing
          app:
            nameOverride: qbittorrent
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              TZ: "${TIMEZONE}"
              QBITTORRENT__PORT: &port 8080
            resources:
              requests:
                cpu: 49m
                memory: 1024Mi
          # doh to avoid dns leaks
          dnsdist:
            image:
              repository: docker.io/powerdns/dnsdist-20
              tag: 2.0.9@sha256:bad7f6cf3824e7fa722ee763f3b101e3f1323c06171d6fa94f034888653c58ec
          # do the vpn thing
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              - name: FIREWALL_INPUT_PORTS
                value: "8080"
              - name: FIREWALL_OUTBOUND_SUBNETS
                # Allow access to k8s subnets
                value: "10.42.0.0/16,10.43.0.0/16"
              - name: SHADOWSOCKS
                value: "on"
              - name: DOT
                value: "off"
              - name: DNS_PLAINTEXT_ADDRESS
                value: "127.0.0.2"
              - name: TZ
                value: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: qbittorrent-secrets
            securityContext:
              privileged: true
              capabilities:
                add:
                  - NET_ADMIN
        pod:
          securityContext:
            runAsUser: 0
            supplementalGroups: [100,10000]
    service: 
      app:
        controller: main
        ports:
          http:
            port: *port
    route:
      app:
        labels:
          # Public DNS opt-in (#3518). Removing this withdraws public DNS for
          # the hostname — pair it with internal resolution. See AGENTS.md.
          dns.home-ops/public: "true"
        hostnames: ["{{ .Release.Name }}.${SECRET_PUBLIC_DOMAIN}"]
        parentRefs:
          # Tier 3 (#3635): the websecurets listener alone. websecurets sits
          # behind traefik-ts, a ClusterIP Service with no LAN address, so the
          # ts-web tailnet proxy is the only path to this route. Neither the
          # public websecure listener nor the LAN websecurelan listener holds
          # a route for this hostname, so a request to either address returns
          # 404. Tier 2 holds no route, and kubectl port-forward is the
          # break-glass path (#3718).
          - name: traefik-gateway
            namespace: networking
            sectionName: websecurets
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: 'ExtensionRef'
                extensionRef:
                  group: 'traefik.io'
                  kind: 'Middleware'
                  name: 'forwardauth-authelia'
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-traefik-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
      allow-auth-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: auth
      allow-arr-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: media
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: sonarr
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: media
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: radarr
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: media
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: lidarr
              ports:
                - port: 8080
                  protocol: TCP
      allow-monitoring-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus-blackbox-exporter
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: uptime-kuma
              ports:
                - port: 8080
                  protocol: TCP
      allow-external-egress:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
    persistence:
      config:
        existingClaim: pvc-qbittorrent
        advancedMounts:
          main:
            app:
              - path: /config
      dev-net-tun:
        type: hostPath
        hostPath: /dev/net/tun
      downloads:
        type: nfs
        server: "${NAS0_IP}"
        path: /volume1/downloads
        advancedMounts:
          main:
            app:
              - path: /downloads
      dnsdist-config:
        type: configMap
        name: qbittorrent-dnsdist
        advancedMounts:
          main:
            dnsdist:
              - path: /etc/dnsdist/dnsdist.conf
                subPath: dnsdist.conf
                readOnly: true
      gluetun-data:
        type: emptyDir
        advancedMounts:
          main:
            gluetun:
              - path: /tmp/gluetun
