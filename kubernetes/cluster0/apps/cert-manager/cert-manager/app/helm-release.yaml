---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 15m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.0
      sourceRef:
        kind: HelmRepository
        name: jetstack-charts
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    # --dns01-recursive-nameservers* pins the DNS-01 *self-check* to the two
    # public resolvers (avoiding split-horizon / stale internal views for
    # `_acme-challenge` TXT propagation). Pod-level DNS is intentionally left
    # at the cluster default (CoreDNS) so ACME directory + Cloudflare API
    # lookups resolve normally. See #3291.
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
      - --dns01-recursive-nameservers-only
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        prometheusInstance: monitoring-system
