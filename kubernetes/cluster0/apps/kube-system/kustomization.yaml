---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations
  - ./cilium/ks.yaml
  # ./coredns/ks.yaml defines TWO sibling Flux Kustomizations: the
  # NetworkPolicy set (cluster-apps-coredns, ./coredns/policy) and the
  # CoreDNS HelmRelease itself (cluster-apps-coredns-app, ./coredns/app).
  # See the per-Kustomization comments in that file for the adoption story
  # and the two-outage post-mortem that shaped the guards.
  - ./coredns/ks.yaml
  - ./intel-device-plugin/ks.yaml
  # The Flux Kustomization at ./local-path-provisioner/ks.yaml points at a
  # NetworkPolicy-only path (./local-path-provisioner/policy/) — the actual
  # local-path-provisioner running in the cluster is the k3s built-in addon,
  # not a Helm release. Phase 4b (#2951) re-enabled the Flux Kustomization
  # pointing at ./policy/; the dead Helm release at ./local-path-provisioner/app/
  # and its orphaned GitRepository source were removed in PR #3009.
  - ./local-path-provisioner/ks.yaml
  - ./node-feature-discovery/ks.yaml
  - ./metrics-server/ks.yaml
  - ./reloader/ks.yaml
