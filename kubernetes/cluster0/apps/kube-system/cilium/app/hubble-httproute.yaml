apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 2
    # (#3635): reachable from the LAN and the tailnet, not from the internet.
    # A tier-2 route is LAN-reachable by design, so the forwardauth-authelia
    # filter below is its identity control and stays permanently.
    # external-dns owns this record (k8s.cname-hubble), so "false" withdraws
    # it on the next reconcile. A LAN client then resolves the hostname
    # through the blocky customDNS pin; a tailnet client through the headscale
    # split entry and extra_records pin (#3677).
    dns.home-ops/public: "false"
spec:
  hostnames:
    - hubble.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    # Tier 2 (#3635, #3678): the LAN and tailnet listeners only. The public
    # websecure listener holds no route for this hostname, so a request to the
    # public address returns 404. Both entries are load-bearing -- the LAN one
    # when tailscale is down, the tailnet one when the operator is off-LAN.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurelan
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: hubble-ui
        namespace: kube-system
        port: 80
      filters:
      - extensionRef:
          group: traefik.io
          kind: Middleware
          name: forwardauth-authelia
        type: ExtensionRef
      matches:                                                                                                                                                                                                                                                  
      - path:                                                                                                                                                                                                                                                   
          type: PathPrefix                                                                                                                                                                                                                                      
          value: /
