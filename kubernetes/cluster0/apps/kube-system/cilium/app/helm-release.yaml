---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      masquerade: true
      preallocateMaps: true
      datapathMode: netkit
    bgpControlPlane:
      enabled: true
    cluster:
      name: ${CLUSTER_NAME}
      id: 1
    endpointRoutes:
      enabled: true
    envoy:
      rollOutPods: true
      prometheus:
         serviceMonitor:
           enabled: true
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
      tls:
        enabled: true
        # The chart default is `auto.method: helm`. That method generates the
        # Hubble CA and leaf certs inside the Helm release at install time and
        # never renews them. The certs expired on 2026-08-01, hubble-relay
        # CrashLooped on the expired peer cert, and the blocked `helm --wait`
        # also stalled the 1.20.1 chart bump (#3494). See #3508.
        #
        # `cronJob` moves issuance to cilium-certgen: a one-shot Job on each
        # install and upgrade, plus a recurring CronJob that regenerates every
        # Hubble leaf cert on the schedule below.
        auto:
          enabled: true
          method: cronJob
          # Leaf validity in days, for hubble-server-certs and
          # hubble-relay-client-certs. 180 days against a monthly schedule
          # gives about 6 renewal attempts of margin. Several consecutive
          # CronJob failures therefore cannot expire a cert.
          certValidityDuration: 180
          # 03:00 on the 1st of every month. CronJob schedules are UTC. The
          # chart does not expose spec.timeZone for the certgen CronJob, so
          # this is not the Pacific/Auckland timezone of the cluster.
          schedule: "0 3 1 * *"
          # The CA (`cilium-ca`) is not on this rotation. certgen runs with
          # `--ca-reuse-secret`, so it creates the CA once with its own
          # 3-year validity and reuses it after that. certgen also runs with
          # `--ca-enforce-validity-throughout-leaves-duration=true`, so this
          # CronJob starts to fail about 180 days before the CA expires. That
          # failure is the signal to rotate the CA by hand.
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    k8sServiceHost: ${CONTROLPLANE_IP}
    k8sServicePort: 6443
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
      leaseDuration: 120s
      leaseRenewDeadline: 60s
      leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      mode: dsr
      protocolDifferentiation:
        enabled: true
    k8sClientRateLimit:
      qps: 80
      burst: 160
    localRedirectPolicy: true
    operator:
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
    rollOutCiliumPods: true
    routingMode: "native"
    autoDirectNodeRoutes: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
