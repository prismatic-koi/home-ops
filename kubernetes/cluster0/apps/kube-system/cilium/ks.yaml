---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-cilium
  namespace: flux-system
spec:
  path: ./kubernetes/cluster0/apps/kube-system/cilium/app
  prune: false # never should be deleted
  sourceRef:
    kind: GitRepository
    name: home-ops-cluster0
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  # postBuild.substituteFrom is also injected by the parent `cluster-apps`
  # Kustomization's patch (see kubernetes/cluster0/flux/apps.yaml). Declaring it
  # explicitly here is a no-op at runtime (strategic-merge of identical content).
  # Removing this block and re-rendering with `scripts/render.sh` produced a
  # byte-identical output (diff had zero lines), so `flate` does not need this
  # block to resolve ${CLUSTER_NAME}: `flate` applies the parent's patches
  # before validation, unlike the retired `flux-local`, which enumerated
  # ks.yaml files directly and skipped the parent's patches (#3053). The block
  # is kept as harmless, explicit documentation of the substitution.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-cilium-config
  namespace: flux-system
spec:
  path: ./kubernetes/cluster0/apps/kube-system/cilium/config
  dependsOn:
    - name: cluster-apps-cilium
  prune: false # never should be deleted
  sourceRef:
    kind: GitRepository
    name: home-ops-cluster0
  interval: 30m
  retryInterval: 1m
  timeout: 5m
