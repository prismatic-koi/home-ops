---
# =============================================================================
# prometheus.ts.${SECRET_PUBLIC_DOMAIN} — tailnet-only web UI (pilot #3466)
#
# Routes the tailnet hostname prometheus.ts.${SECRET_PUBLIC_DOMAIN} to the
# in-cluster prometheus Service on the traefik `websecure` listener. Reached
# only via the ts-web tailscale proxy (networking) -> traefik :443 -> here.
# TLS terminates on traefik with the *.ts.${SECRET_PUBLIC_DOMAIN} cert.
#
# Lives in `monitoring` (same namespace as the backend Service) so the
# backendRef needs no ReferenceGrant — same pattern as the hubble-ui and
# longhorn HTTPRoutes, which live beside their own Services.
#
# NO forwardauth-authelia middleware: access control is the tailnet ACL
# (ben@ -> tag:ts-web tcp:443 in headscale policy.hujson). Prometheus is a
# read-mostly, non-destructive UI; this is the whole point of the pilot.
#
# external-dns publication is now FAIL-CLOSED (#3518): external-dns runs
# --label-filter=dns.home-ops/public=true, so a route without that label is
# invisible to it and gets no public record. This route carries the label with
# the value "false" (#3519), which is what keeps the hostname tailnet-only. Do
# not change it to "true".
#
# Three HTTPRoutes on the cluster are private: this one,
# networking/httpsredirect and home/searxng. They are NOT the same case.
# httpsredirect declares no hostnames, so it can never produce a record and its
# value is immaterial. searxng declares one and had a public record until #3555
# withdrew it; a headscale pin and a blocky pin resolve it now. This route
# declares a hostname and never had a public record, so the label is the only
# control. Every other route had a public record before #3518 and kept it.
#
# external-dns.alpha.kubernetes.io/controller: none is KEPT as a second,
# independent layer (#3466). It is no longer the primary control, but it costs
# nothing and it holds even if someone copies this file and pastes the opt-in
# label in by mistake. Two independent mechanisms must both fail before this
# hostname leaks to public DNS. `none` is the only per-object opt-out that
# external-dns v0.21.0 actually reads — the `.../exclude` annotation does NOT
# exist in that version and is silently ignored.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-ts-web
  namespace: monitoring
  labels:
    # Private DNS decision (#3519), not an omission. Tailnet-only pilot
    # (#3466): the hostname stays off public DNS. external-dns publishes only
    # `dns.home-ops/public: "true"`, so "false" keeps this route invisible to
    # it and changes nothing at runtime. Do NOT change this to "true".
    dns.home-ops/public: "false"
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - prometheus.ts.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: prometheus-kube-prometheus-prometheus
          namespace: monitoring
          port: 9090
      matches:
        - path:
            type: PathPrefix
            value: /
