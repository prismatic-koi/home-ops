---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 85.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-charts
        namespace: flux-system
      interval: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    cleanPrometheusOperatorObjectNames: true

    # -- Default alerting rules shipped with the chart.
    # Disable entire groups or individual alerts by setting to false.
    defaultRules:
      create: true
      rules:
        # Alertmanager self-monitoring (is it up, can it send alerts, config valid)
        alertmanager: true
        # etcd cluster health - not exposed in k3s, these will never fire
        etcd: false
        # Config reloader sidecar errors (Prometheus/Alertmanager config reload failures)
        configReloaders: true
        # General: Watchdog (dead-man's switch), InfoInhibitor
        general: true
        # Recording rules for container CPU/memory metrics (no alerts, just pre-computed metrics)
        k8sContainerCpuUsageSecondsTotal: true
        k8sContainerMemoryCache: true
        k8sContainerMemoryRss: true
        k8sContainerMemorySwap: true
        k8sContainerResource: true
        k8sContainerMemoryWorkingSetBytes: true
        k8sPodOwner: true
        # API server availability and SLO burn rate alerts
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: true
        kubeApiserverHistogram: true
        kubeApiserverSlos: true
        # Controller manager - not exposed in k3s
        kubeControllerManager: false
        # Kubelet health and certificate expiry alerts
        kubelet: true
        # kube-proxy - not used, Cilium handles networking
        kubeProxy: false
        # General Prometheus recording rules
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        # Pod/Deployment/StatefulSet/DaemonSet health alerts - requires kube-state-metrics
        kubernetesApps: true
        # CPU/memory overcommit alerts - you are intentionally over-provisioned, consider disabling
        kubernetesResources: true
        # PVC filling up alerts - very useful, caught the Loki issue
        kubernetesStorage: true
        # KubeVersionMismatch, KubeClientErrors
        kubernetesSystem: true
        # Scheduler - not exposed in k3s
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        # kube-state-metrics self-monitoring
        kubeStateMetrics: true
        # Node network error alerts
        network: true
        # Node recording rules (no alerts)
        node: true
        # Node exporter alerts (disk, memory, CPU, filesystem) - requires node-exporter
        # node-exporter is disabled below; re-enable both together if you want host-level alerts
        nodeExporterAlerting: false
        nodeExporterRecording: false
        # Prometheus self-monitoring
        prometheus: true
        # Prometheus Operator health
        prometheusOperator: true
        # Windows node alerts - not applicable
        windows: false

      # Disable specific noisy alerts without disabling entire rule groups.
      # Individual alerts within an enabled group can be suppressed here.
      disabled:
        # You are intentionally over-provisioned - these will fire constantly
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true
        # Quota alerts - you don't use resource quotas
        KubeCPUQuotaOvercommit: true
        KubeMemoryQuotaOvercommit: true
        KubeQuotaAlmostFull: true
        KubeQuotaExceeded: true
        KubeQuotaFullyUsed: true
        # HPA alerts - you don't use HorizontalPodAutoscaler
        KubeHpaMaxedOut: true
        KubeHpaReplicasMismatch: true
        # CPUThrottlingHigh - very noisy in homelabs, normal for bursty workloads
        CPUThrottlingHigh: true

    alertmanager:
      enabled: true
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 2
        podAntiAffinity: hard
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 1Gi
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: "${SECRET_SMTP_HOST}:587"
          smtp_from: "${SECRET_NOTIFICATION_EMAIL}"
          smtp_hello: "${SECRET_PUBLIC_DOMAIN}"
          smtp_require_tls: true
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: email
          routes:
            # Silence the dead-man's switch and info inhibitor
            - receiver: "null"
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog"
        receivers:
          - name: "null"
          - name: email
            email_configs:
              - to: "${SECRET_ADMIN_EMAIL}"
                send_resolved: true
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal: ["namespace"]
          - target_matchers:
              - alertname = InfoInhibitor

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: (apiserver_audit|apiserver_client|apiserver_delegated|apiserver_envelope|apiserver_storage|apiserver_webhooks|authentication_token|cadvisor_version|container_blkio|container_cpu|container_fs|container_last|container_memory|container_network|container_oom|container_processes|container|csi_operations|disabled_metric|get_token|go|hidden_metric|kubelet_certificate|kubelet_cgroup|kubelet_container|kubelet_containers|kubelet_cpu|kubelet_device|kubelet_graceful|kubelet_http|kubelet_lifecycle|kubelet_managed|kubelet_node|kubelet_pleg|kubelet_pod|kubelet_run|kubelet_running|kubelet_runtime|kubelet_server|kubelet_started|kubelet_volume|kubernetes_build|kubernetes_feature|machine_cpu|machine_memory|machine_nvm|machine_scrape|node_namespace|plugin_manager|prober_probe|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|storage_operation|volume_manager|volume_operation|workqueue)_(.+)
          - action: replace
            sourceLabels: ["node"]
            targetLabel: instance
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: (aggregator_openapi|aggregator_unavailable|apiextensions_openapi|apiserver_admission|apiserver_audit|apiserver_cache|apiserver_cel|apiserver_client|apiserver_crd|apiserver_current|apiserver_envelope|apiserver_flowcontrol|apiserver_init|apiserver_kube|apiserver_longrunning|apiserver_request|apiserver_requested|apiserver_response|apiserver_selfrequest|apiserver_storage|apiserver_terminated|apiserver_tls|apiserver_watch|apiserver_webhooks|authenticated_user|authentication|disabled_metric|etcd_bookmark|etcd_lease|etcd_request|field_validation|get_token|go|grpc_client|hidden_metric|kube_apiserver|kubernetes_build|kubernetes_feature|node_authorizer|pod_security|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|serviceaccount_legacy|serviceaccount_stale|serviceaccount_valid|watch_cache|workqueue)_(.+)
          # Drop high cardinality labels
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        replicas: 2
        replicaExternalLabelName: __replica__
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: false
        walCompression: true
        enableFeatures:
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        retention: 2d
        retentionSize: 15GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 20Gi
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          multicluster:
            etcd:
              enabled: true
    # kube-state-metrics: exposes pod/deployment/statefulset/PVC state as metrics.
    # Required for most kubernetesApps and kubernetesStorage alert rules to function.
    kubeStateMetrics:
      enabled: true
    # node-exporter: exposes host-level metrics (CPU, memory, disk, filesystem).
    # Disabled for now - re-enable alongside nodeExporterAlerting/nodeExporterRecording
    # above if you want host-level alerting.
    nodeExporter:
      enabled: false
