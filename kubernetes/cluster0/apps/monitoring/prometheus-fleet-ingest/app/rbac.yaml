---
# =============================================================================
# fleet-ingest ServiceAccount
#
# Dedicated SA for the push-only ingest Prometheus (issue #3386). Kept
# deliberately minimal:
#
#   * No ClusterRole / ClusterRoleBinding. `serviceMonitorSelector`,
#     `podMonitorSelector`, and `probeSelector` are nil (select nothing),
#     and `scrapeConfigSelector` (see prometheus.yaml) is set, but only to
#     flip the operator into managed-config mode — its matchLabels value
#     matches no object in the cluster, so no ScrapeConfig is ever
#     selected. Either way, the ingest instance never performs Kubernetes
#     SD. Prometheus itself boots fine without cluster-wide list/watch on
#     nodes/services/endpoints/pods.
#
#   * Distinct name from the HA pair's `prometheus-kube-prometheus-prometheus`
#     SA. Keeps the ingest fully self-contained so the "rip it out cleanly"
#     property in the issue holds — delete this dir and nothing else changes.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-ingest
  namespace: monitoring
