---
# Grafana Alloy syslog receiver for the UCG Ultra (#4145).
#
# One replica receives syslog on UDP 514 and pushes it to the in-cluster Loki.
# The LoadBalancer Service in service.yaml gives it the fixed LAN address
# ${UNIFI_SYSLOG_IP}.
#
# This is a separate release from the alloy DaemonSet. The DaemonSet runs one
# pod per node, and a syslog receiver needs one fixed address.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # The pod label app.kubernetes.io/name takes this value. With the chart
    # default ("alloy"), every policy of the alloy DaemonSet also selects this
    # pod, and that grants it kube-apiserver access that it does not need.
    nameOverride: alloy-syslog

    # The alloy release owns the PodLogs CRD. This release does not use it.
    crds:
      create: false

    controller:
      type: deployment
      replicas: 1
      volumes:
        extra:
          - name: tmp
            emptyDir: {}

    # The config uses no Kubernetes API, so the pod gets no RBAC and no
    # service account token. As a result, it needs no kube-apiserver egress.
    rbac:
      create: false
    serviceAccount:
      create: true
      automountServiceAccountToken: false

    # The chart Service always adds the TCP 12345 port of the Alloy UI. A
    # LoadBalancer of the chart would publish the UI on the LAN address, so
    # service.yaml holds the LoadBalancer with UDP 514 only.
    service:
      enabled: false

    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root user bind UDP 514. This sysctl is in the safe set
        # of the kubelet, and it applies to the network namespace of the pod
        # only. If the bind fails, Alloy logs an error but the pod stays Ready
        # with no syslog listener.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"

    alloy:
      enableReporting: false
      # otelcol.receiver.syslog is a public-preview component.
      stabilityLevel: public-preview
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # The chart default storagePath /tmp/alloy is inside this emptyDir. The
      # root filesystem is read-only.
      mounts:
        extra:
          - name: tmp
            mountPath: /tmp
      extraPorts:
        - name: syslog-udp
          port: 514
          targetPort: 514
          protocol: UDP
      configMap:
        create: true
        # The chart passes this content through the Helm tpl function. Do not
        # put a Go template action (two open braces) in it. This rule also
        # applies to a comment.
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          // UniFi gateways send BSD syslog (RFC 3164). The Network app sends
          // its SIEM (CEF) events to the same address and port with no <PRI>
          // header. loki.source.syslog rejects such a packet, and
          // allow_skip_pri_header accepts it.
          //
          // A BSD timestamp has no year and no time zone. UniFi writes local
          // time, so location must be the time zone of the cluster.
          otelcol.receiver.syslog "unifi" {
            protocol              = "rfc3164"
            allow_skip_pri_header = true
            location              = "Pacific/Auckland"

            udp {
              listen_address = "0.0.0.0:514"
            }

            output {
              logs = [otelcol.processor.transform.unifi.input]
            }
          }

          // Make the entry that the exporter builds.
          // - The line is the text after the syslog header. The body holds
          //   the raw packet.
          // - The entry time is the time of receipt, not the device clock.
          // - The header fields get the names that they had with
          //   loki.source.syslog. The hint attributes make the exporter
          //   emit them as labels, so that loki.process can read them. The
          //   label_keep stage below removes them.
          // A packet with no <PRI> has no facility and no severity.
          otelcol.processor.transform "unifi" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                "set(time, observed_time)",
                "set(attributes[\"app_name\"], attributes[\"appname\"]) where attributes[\"appname\"] != nil",
                "set(attributes[\"facility\"], attributes[\"facility_text\"]) where attributes[\"facility_text\"] != nil",
                "set(attributes[\"severity\"], severity_text) where severity_text != \"\"",
                "set(body, attributes[\"message\"]) where attributes[\"message\"] != nil",
                "set(attributes[\"loki.format\"], \"raw\")",
                "set(attributes[\"loki.attribute.labels\"], \"hostname,app_name,facility,severity\")",
              ]
            }

            output {
              logs = [otelcol.exporter.loki.unifi.input]
            }
          }

          otelcol.exporter.loki "unifi" {
            forward_to = [loki.process.unifi.receiver]
          }

          loki.process "unifi" {
            // A UniFi device logs its inform authkey when it saves its
            // config. The key authenticates the device to the controller,
            // so it must not reach Loki. The expression matches a value of
            // any format, not only hex. Keep this stage before every stage
            // that reads the line, or that stage can copy the key.
            stage.replace {
              expression = "(?i)authkey:\\s*(\\S+)"
              replace    = "<redacted>"
            }

            // The exporter sets other labels, and job is not among them.
            stage.static_labels {
              values = { job = "unifi-syslog" }
            }

            // Keep the header fields searchable, but not as stream labels. A
            // UniFi device can put its MAC address in the hostname field.
            stage.structured_metadata {
              values = {
                hostname = "",
                app_name = "",
                severity = "",
                facility = "",
              }
            }

            // The only stream label is job. Do not add a label from the
            // message or its header. These hold client names, MAC addresses
            // and IP addresses. Search for a client with a line filter.
            stage.label_keep {
              values = ["job"]
            }

            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
