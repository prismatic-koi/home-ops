---
# The LAN address of the syslog receiver. The UCG Ultra sends to
# ${UNIFI_SYSLOG_IP}:514/UDP.
#
# The router reaches this address through BGP. With Local, Cilium advertises
# the address only from the node that runs the receiver pod. With Cluster,
# the router can pick any node, and a cross-node DSR forward to the pod is
# lost (#4145).
apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  namespace: monitoring
  annotations:
    io.cilium/lb-ipam-ips: ${UNIFI_SYSLOG_IP}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: alloy-syslog
    app.kubernetes.io/instance: alloy-syslog
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
