---
# =============================================================================
# alloy-syslog NetworkPolicy (#4145)
# Pod label: app.kubernetes.io/name=alloy-syslog
# Listens on:
#   :514/UDP  (syslog from each UniFi device, through the alloy-syslog LoadBalancer)
# Egress to:
#   loki.monitoring.svc :3100  (log push)
#   kube-dns            :53    (name resolution)
#
# The pod has no service account token and uses no Kubernetes API, so it has
# no kube-apiserver egress and no CiliumNetworkPolicy.
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-default-deny
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-syslog
  policyTypes: [Ingress, Egress]
---
# Syslog over UDP has no authentication, and the LoadBalancer address is
# reachable from the whole LAN. Since #4159 step 3, the management subnet
# holds only UniFi gear, so the rule admits the whole subnet. The controller
# refuses a DHCP reservation for an adopted device, so device addresses are
# not pinned. The UCG Ultra also sends from its address on the server network
# (BGP_IP).
#
# Cilium matches an ipBlock peer with the same CIDR selector as a
# CiliumNetworkPolicy fromCIDR peer. A CIDR selector matches a source outside
# the cluster, such as the router. It does not match a node address. So this
# rule needs the source address of the device at the pod. The Local policy
# delivers each datagram on the node that runs the pod, so Cilium does not
# change the source address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-allow-unifi-syslog-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-syslog
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: ${UNIFI_MGMT_CIDR}
        - ipBlock:
            cidr: ${BGP_IP}/32 # router interface on the server network
      ports:
        - port: 514
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-allow-dns
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-syslog
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
---
# Companion of loki-allow-alloy-syslog-ingress in the loki app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-allow-loki-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-syslog
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 3100
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
