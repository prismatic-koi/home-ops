---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
  values:
    grafana.ini:
      users:
        default_timezone: Pacific/Auckland
      smtp:
        enabled: true
        host: ${SECRET_SMTP_HOST}:587
        from_address: ${SECRET_NOTIFICATION_EMAIL}
        ehlo_identity: ${SECRET_PUBLIC_DOMAIN}
        startTLS_policy: MandatoryStartTLS
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: email-admin
            receivers:
              - uid: email-admin
                type: email
                settings:
                  addresses: ${SECRET_ADMIN_EMAIL}
                  # Notification template "prism-spawn-budget" (templates.yaml).
                  subject: '{{`{{ template "prism.subject" . }}`}}'
                  message: '{{`{{ template "prism.message" . }}`}}'
      templates.yaml:
        apiVersion: 1
        templates:
          - orgId: 1
            name: prism-spawn-budget
            template: |-
              {{`{{ define "prism.subject" }}{{ with .Alerts.Firing }}{{ with index . 0 }}{{ if .Annotations.state }}Spawn budget {{ .Annotations.state }}: rest today{{ else }}Spawn budget alert: rest today{{ end }}{{ end }}{{ else }}{{ with .Alerts.Resolved }}{{ with index . 0 }}{{ if .Annotations.state }}Spawn budget back under: {{ .Annotations.state }}{{ else }}Spawn budget back under limit{{ end }}{{ end }}{{ end }}{{ end }}{{ end }}
              {{ define "prism.message" }}{{ range .Alerts.Firing }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}The spawn budget alert is firing. Open the dashboard for the numbers.{{ end }}
              {{ if .Annotations.projection }}{{ .Annotations.projection }}
              {{ end }}{{ if .Annotations.last_24h }}{{ .Annotations.last_24h }}
              {{ end }}{{ if .PanelURL }}Dashboard: {{ .PanelURL }}
              {{ end }}{{ end }}{{ range .Alerts.Resolved }}{{ if .Annotations.resolved }}{{ .Annotations.resolved }}{{ else }}The 7-day worker spawn count is back under budget.{{ end }}
              {{ if .PanelURL }}Dashboard: {{ .PanelURL }}
              {{ end }}{{ end }}{{ end }}`}}
      timeintervals.yaml:
        apiVersion: 1
        timeIntervals:
          - orgId: 1
            name: prism-morning-window
            time_intervals:
              - times:
                  - start_time: "08:00"
                    end_time: "09:00"
                location: Pacific/Auckland
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: email-admin
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: prism-spawn-budget
            folder: Fleet
            interval: 1m
            rules:
              - uid: prism-spawn-budget-95
                title: Prism spawn budget at 95%
                condition: threshold
                data:
                  - refId: count_query
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: P09FC0E78B5F11C2D
                    model:
                      refId: count_query
                      expr: 'sum(increase(prism_spawns_total{agent_role="worker"}[7d]))'
                      instant: true
                      range: false
                  - refId: count
                    datasourceUid: __expr__
                    model:
                      refId: count
                      type: reduce
                      expression: count_query
                      reducer: last
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: limit_query
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: P09FC0E78B5F11C2D
                    model:
                      refId: limit_query
                      expr: 'max(last_over_time(prism_spawn_limit[7d]))'
                      instant: true
                      range: false
                  - refId: limit
                    datasourceUid: __expr__
                    model:
                      refId: limit
                      type: reduce
                      expression: limit_query
                      reducer: last
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: count_1d_query
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: P09FC0E78B5F11C2D
                    model:
                      refId: count_1d_query
                      expr: 'sum(increase(prism_spawns_total{agent_role="worker"}[1d])) or vector(0)'
                      instant: true
                      range: false
                  - refId: count_1d
                    datasourceUid: __expr__
                    model:
                      refId: count_1d
                      type: reduce
                      expression: count_1d_query
                      reducer: last
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: count_6d_query
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: P09FC0E78B5F11C2D
                    model:
                      refId: count_6d_query
                      expr: 'sum(increase(prism_spawns_total{agent_role="worker"}[6d])) or vector(0)'
                      instant: true
                      range: false
                  - refId: count_6d
                    datasourceUid: __expr__
                    model:
                      refId: count_6d
                      type: reduce
                      expression: count_6d_query
                      reducer: last
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: count_5d_query
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: P09FC0E78B5F11C2D
                    model:
                      refId: count_5d_query
                      expr: 'sum(increase(prism_spawns_total{agent_role="worker"}[5d])) or vector(0)'
                      instant: true
                      range: false
                  - refId: count_5d
                    datasourceUid: __expr__
                    model:
                      refId: count_5d
                      type: reduce
                      expression: count_5d_query
                      reducer: last
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: ratio
                    datasourceUid: __expr__
                    model:
                      refId: ratio
                      type: math
                      expression: '$count / $limit'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: percent
                    datasourceUid: __expr__
                    model:
                      refId: percent
                      type: math
                      expression: '$ratio * 100'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: clear_at
                    datasourceUid: __expr__
                    model:
                      refId: clear_at
                      type: math
                      expression: 'floor($limit * 95 / 100)'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: to_leave
                    datasourceUid: __expr__
                    model:
                      refId: to_leave
                      type: math
                      expression: '$count - $clear_at'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: pct_24h
                    datasourceUid: __expr__
                    model:
                      refId: pct_24h
                      type: math
                      expression: '$count_6d / $limit * 100'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: pct_48h
                    datasourceUid: __expr__
                    model:
                      refId: pct_48h
                      type: math
                      expression: '$count_5d / $limit * 100'
                      datasource:
                        type: __expr__
                        uid: __expr__
                  - refId: threshold
                    datasourceUid: __expr__
                    model:
                      refId: threshold
                      type: threshold
                      expression: ratio
                      conditions:
                        - evaluator:
                            type: gt
                            params: [0.9499999]
                      datasource:
                        type: __expr__
                        uid: __expr__
                noDataState: KeepLast
                execErrState: Error
                for: 5m
                annotations:
                  __dashboardUid__: prism-fleet-telemetry
                  __panelId__: "31"
                  summary: |-
                    {{`{{ $c := "?" }}{{ with $values.count }}{{ $c = printf "%.0f" .Value }}{{ end }}{{ $l := "?" }}{{ with $values.limit }}{{ $l = printf "%.0f" .Value }}{{ end }}{{ $p := "?" }}{{ with $values.percent }}{{ $p = printf "%.0f" .Value }}{{ end }}{{ $k := "?" }}{{ with $values.clear_at }}{{ $k = printf "%.0f" .Value }}{{ end }}{{ $t := "?" }}{{ with $values.to_leave }}{{ $t = printf "%.0f" .Value }}{{ end }}{{ $c }} of {{ $l }} worker spawns in the last 7 days ({{ $p }}%). The alert clears at {{ $k }} or fewer. {{ $t }} more spawns must leave the 7-day window. Finish the current work and stop for the day.`}}
                  projection: |-
                    {{`{{ $c6 := "?" }}{{ with $values.count_6d }}{{ $c6 = printf "%.0f" .Value }}{{ end }}{{ $p24 := "?" }}{{ with $values.pct_24h }}{{ $p24 = printf "%.0f" .Value }}{{ end }}{{ $c5 := "?" }}{{ with $values.count_5d }}{{ $c5 = printf "%.0f" .Value }}{{ end }}{{ $p48 := "?" }}{{ with $values.pct_48h }}{{ $p48 = printf "%.0f" .Value }}{{ end }}If you spawn nothing, you are at {{ $c6 }} ({{ $p24 }}%) in 24 hours and {{ $c5 }} ({{ $p48 }}%) in 48 hours.`}}
                  last_24h: |-
                    {{`{{ $c1 := "?" }}{{ with $values.count_1d }}{{ $c1 = printf "%.0f" .Value }}{{ end }}{{ if eq $c1 "0" }}Last 24 hours: 0 spawns. The pause is working.{{ else }}Last 24 hours: {{ $c1 }} spawns.{{ end }}`}}
                  state: |-
                    {{`{{ $c := "?" }}{{ with $values.count }}{{ $c = printf "%.0f" .Value }}{{ end }}{{ $l := "?" }}{{ with $values.limit }}{{ $l = printf "%.0f" .Value }}{{ end }}{{ $p := "?" }}{{ with $values.percent }}{{ $p = printf "%.0f" .Value }}{{ end }}{{ $c }}/{{ $l }} ({{ $p }}%)`}}
                  resolved: |-
                    {{`{{ $c := "?" }}{{ with $values.count }}{{ $c = printf "%.0f" .Value }}{{ end }}{{ $l := "?" }}{{ with $values.limit }}{{ $l = printf "%.0f" .Value }}{{ end }}{{ $p := "?" }}{{ with $values.percent }}{{ $p = printf "%.0f" .Value }}{{ end }}Back under budget: {{ $c }} of {{ $l }} ({{ $p }}%).`}}
                labels:
                  severity: warning
                notification_settings:
                  receiver: email-admin
                  # 23h, not 24h: the 1-hour active window then never drifts out of reach.
                  repeat_interval: 23h
                  active_time_intervals:
                    - prism-morning-window
    rbac:
      pspEnabled: false # disable psp, deprecatd in k8s 1.25
    replicas: 1
    deploymentStrategy:
      type: Recreate
    image:
      repository: grafana/grafana
      tag: 13.2.4
    route:
      main:
        enabled: true
        labels:
          # Private DNS decision (#3519), not an omission. This hostname is
          # tailnet-only by intent: it is served on the tier-3 websecurets
          # listener alone. external-dns does not own this record, so "false"
          # is inert for it and the record needs a manual Cloudflare delete
          # (#3607). A tailnet client resolves the hostname only through a
          # headscale split entry and extra_records pin -- see
          # networking/headscale config.yaml.
          dns.home-ops/public: "false"
          # Exposure tier (#3734). Tier 3 = tailnet-only (websecurets). This
          # label and the parentRefs sectionName must agree; the lint enforces it.
          exposure.home-ops/tier: "3"
        hostnames: ["{{ .Release.Name }}.${SECRET_PUBLIC_DOMAIN}"]
        # Tier-3 (websecurets) listener only (step 2 of #3607, design in
        # #3635). The public websecure listener serves no route for this
        # hostname, so a request to the public address returns 404 whatever
        # the client resolves. websecurets sits behind traefik-ts, a ClusterIP
        # Service with no LAN address, so the ts-web tailnet proxy is the only
        # path to this route. A websecure entry restores public reachability;
        # there is no LAN-only tier any more (#3739).
        parentRefs:
          - name: traefik-gateway
            namespace: networking
            sectionName: websecurets
    persistence:
      enabled: true
      storageClass: longhorn
      existingClaim: pvc-grafana
      retain: true
    admin:
      existingSecret: grafana-secrets
      userKey: admin-user
      passwordKey: admin-password
    # Sidecar: auto-discover ConfigMaps in any namespace carrying the
    # grafana_dashboard / grafana_datasource labels (kube-prometheus-stack
    # already emits many dashboard ConfigMaps with grafana_dashboard=1).
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL
    # Canonical datasource list lives in Git alongside the HelmRelease.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
            isDefault: true
            jsonData:
              timeInterval: 30s
          # Fleet-metrics ingest Prometheus (issue #3386) — separate single-
          # replica CR that receives remote_write pushes from roaming fleet
          # devices. Deliberately a distinct datasource from `Prometheus`
          # above so ad-hoc explore queries can be aimed at push-only data
          # without touching the HA scrape pair. NOT isDefault. Egress from
          # Grafana to :9090 in the monitoring namespace is already covered
          # by grafana-allow-prometheus-egress (podSelector matches this
          # instance too via app.kubernetes.io/name=prometheus).
          - name: Prometheus (Fleet Ingest)
            type: prometheus
            access: proxy
            # Pin the uid so it is declared in Git and reprovision-safe. The
            # in-repo prism fleet dashboard (grafana-dashboard-prism-fleet)
            # binds every panel to this uid; without pinning, Grafana would
            # generate a random uid on first provision and store it only in
            # the longhorn PVC, so a PVC rebuild / DR reprovision would
            # regenerate a different uid and break every panel silently.
            uid: P09FC0E78B5F11C2D
            url: http://fleet-ingest.monitoring.svc:9090
            jsonData:
              # Fleet Alloy typically pushes on a 15s interval; keep the
              # query time step aligned.
              timeInterval: 15s
          # Loki datasource — SingleBinary Loki backed by SeaweedFS S3 (#3347).
          # Loki auth_enabled is false, so no basicAuth / X-Scope-OrgID needed.
          - name: Loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc:3100
            jsonData:
              # Cap concurrent line-limit queries; the SingleBinary Loki has
              # modest resources and we don't need higher parallelism here.
              maxLines: 1000
    # Provider that the chart drops gnetId-fetched dashboards into.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    # Community dashboards pulled by gnetId at chart-render time.
    # Revisions verified against grafana.com on 2026-05-28.
    # NOTE: a Cilium dashboard was considered (spec suggested id 13770) but
    # that id resolves to an unrelated dashboard on grafana.com; dropped
    # rather than guess at the correct id. Add in a follow-up if desired.
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 45
          datasource: Prometheus
        kubernetes-views-pods:
          gnetId: 15760
          revision: 39
          datasource: Prometheus
