---
# zigbee2mqtt command failure dashboard (#3885), provisioned by the Grafana
# sidecar. Pattern: dashboard-prism-fleet.yaml. Data comes from the Alloy
# counter loki_process_custom_zigbee2mqtt_command_failures_total.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-zigbee2mqtt
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Home
    # Disable Flux postBuild substitution so Grafana variables stay literal.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  zigbee2mqtt.json: |
    {
      "title": "zigbee2mqtt command failures",
      "uid": "zigbee2mqtt-failures",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "1m",
      "tags": ["zigbee2mqtt"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Command failures per 5 minutes by reason",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "sum by (reason) (increase(loki_process_custom_zigbee2mqtt_command_failures_total[5m]))",
              "legendFormat": "{{reason}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Command failures per 5 minutes by device",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "sum by (device) (increase(loki_process_custom_zigbee2mqtt_command_failures_total[5m]))",
              "legendFormat": "{{device}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failures with reason=send in time range",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "sum(increase(loki_process_custom_zigbee2mqtt_command_failures_total{reason=\"send\"}[$__range]))",
              "instant": true
            }
          ]
        }
      ]
    }
