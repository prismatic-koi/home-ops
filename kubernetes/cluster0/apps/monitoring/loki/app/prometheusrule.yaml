---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki
  namespace: monitoring
spec:
  groups:
    - name: loki.guardrails
      rules:
        # Phase 3 guardrail (#3347): the previous loki-stack failure mode was
        # unbounded growth going unnoticed until a Longhorn PVC filled up.
        # Loki now lives on SeaweedFS S3 with retention_period: 168h enforced
        # by the compactor, so the bucket should plateau -- steady growth
        # past that point means either retention/the compactor stopped
        # working, or ingestion has outgrown the 7-day retention budget.
        # Threshold is a soft early-warning, not a hard cluster capacity
        # limit; adjust as the SeaweedFS cluster's total capacity is known.
        - alert: LokiS3BucketUsageHigh
          expr: |
            SeaweedFS_s3_bucket_size_bytes{bucket="loki"} > 20 * 1024 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Loki S3 bucket usage is above 20GiB"
            description: "The 'loki' SeaweedFS S3 bucket has held more than 20GiB for over 30 minutes ({{ $value | humanize1024 }}B). With a 168h (7d) retention_period this should plateau -- sustained growth past this point suggests the compactor has stopped deleting old chunks, or ingestion volume has outgrown the retention budget."

        # Guards the same failure mode from the ingestion side: a
        # misbehaving stream sustaining high ingest for an extended period
        # will fill the bucket well before the 20GiB alert above fires.
        # 6 MB/s sustained for 15m sits below the tenant-wide
        # ingestion_rate_mb: 8 ceiling in limits_config, so it fires before
        # Loki starts discarding samples -- an early warning, not a
        # duplicate of the discard-driven alert below.
        - alert: LokiIngestionRateHigh
          expr: |
            sum(rate(loki_distributor_bytes_received_total[15m])) > 6 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki ingestion rate is unusually high"
            description: "Loki has received log data at over 6MB/s for 15 minutes ({{ $value | humanize1024 }}B/s), approaching the tenant-wide ingestion_rate_mb: 8 limit. Check for a misbehaving/log-looping pod before Loki starts discarding samples."

        # Direct signal that limits_config guardrails are actively rejecting
        # data -- i.e. a stream or the tenant has hit the caps configured
        # above. This is expected occasionally under a genuine burst, but
        # sustained discards for 15m mean something is stuck emitting logs
        # far above normal volume. Scoped to reasons that indicate a real
        # limit was hit (as opposed to benign age-based rejects, handled by
        # LokiIngestionDiscardsAgeBasedHigh below) -- kept at a `> 0` floor
        # since these reasons should never fire under normal operation.
        - alert: LokiIngestionDiscardsHigh
          expr: |
            sum(rate(loki_discarded_samples_total{reason=~"rate_limited|per_stream_rate_limit|stream_limit|line_too_long|max_line_size|per_stream_series_limit"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki is discarding ingested log samples (limit hit)"
            description: "Loki has discarded log samples over the last 15 minutes (reason={{ $labels.reason }}, tenant={{ $labels.tenant }}). Common causes by reason: `rate_limited` / `per_stream_rate_limit` -> a stream or tenant hit the ingestion_rate_mb / per_stream_rate_limit guardrails in limits_config; `stream_limit` / `per_stream_series_limit` -> too many distinct label combinations for a stream/tenant, check discovered stream label cardinality in Loki first (see #3395 for prior art); `line_too_long` / `max_line_size` -> a source is emitting abnormally large log lines. Investigate the source pod/namespace before increasing limits."

        # Age-based rejects (greater_than_max_sample_age, too_far_behind,
        # out_of_order). The in-cluster Alloy drops a line that is more than
        # 45m old when it reads it (#3892). So the hourly
        # loki.source.kubernetes re-send and the re-read after an Alloy
        # restart do not reach Loki, and a steady trickle of these rejects is
        # not expected. A short burst can still occur, for example after an
        # outage or from a client outside the cluster. A `> 0` floor on
        # loki_discarded_samples_total flaps on any small burst, because the
        # 15m rate window keeps re-arming. Alert on the RATIO of age-based
        # discards to lines received instead. The alert fires only when
        # age-based discards are more than 1% of ingest, which indicates a
        # large-scale timestamp/ordering problem.
        # clamp_min(..., 1) guards the denominator so the ratio is 0 (not
        # firing, not NaN) when ingest is idle, instead of dividing by ~0
        # and spuriously firing on noise.
        - alert: LokiIngestionDiscardsAgeBasedHigh
          expr: |
            (
              sum(rate(loki_discarded_samples_total{reason=~"greater_than_max_sample_age|too_far_behind|out_of_order"}[15m]))
                /
              clamp_min(sum(rate(loki_distributor_lines_received_total[15m])), 1)
            ) > 0.01
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki is discarding a material fraction of ingested lines as too old/out-of-order"
            description: "Loki has discarded more than 1% of received lines over the last 15 minutes due to age/ordering (reason={{ $labels.reason }}, tenant={{ $labels.tenant }}), current ratio {{ $value | humanizePercentage }}. `too_far_behind` / `greater_than_max_sample_age` / `out_of_order` at this scale suggest stream collapse from over-aggressive label rewriting (e.g. a bad Alloy pipeline stamping the same value on many pods) producing out-of-order timestamps that trip the ingester's window -- do NOT just raise limits; check discovered stream label cardinality in Loki first (see #3395 for prior art). The in-cluster Alloy drops lines older than 45m before it sends them (#3892), so a steady trickle of age-based discards is not expected either. If discards continue below this ratio, read the Loki write-failure logs (`write operation failed`) to find the stream and the client that send old lines."


