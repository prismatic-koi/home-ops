---
# Grafana Loki — SingleBinary mode, backed by SeaweedFS S3.
#
# Retention correctness is the whole point of this deployment (see #3347):
# the previous loki-stack removed in #2734 set limits_config.retention_period
# but never enabled the compactor, so retention was silently a no-op. Here
# the compactor is enabled with retention_enabled: true and delete_request_store
# set to s3, which is what actually deletes chunks past retention_period.
#
# Chunks + index live in the SeaweedFS S3 bucket "loki"; the StatefulSet keeps
# a small 10Gi Longhorn PVC for /var/loki (WAL, boltdb-shipper cache, ruler
# WAL). No bulk log data lives on Longhorn.
#
# Chart source (#3400): the `loki` chart in grafana/helm-charts went
# GEL-only from v7.0.0 onward -- as of chart 7.0.0 it's maintained for
# Grafana Enterprise Logs users only, and OSS installs moved to the
# community-maintained fork at grafana-community/helm-charts, forked at
# exactly chart v6.55.0 (see grafana/loki#20705). This HelmRelease sources
# from the `grafana-community-charts` HelmRepository, NOT `grafana-charts`,
# and is deliberately held at 6.55.0 -- the last OSS-supported version. Do
# NOT repoint this back at `grafana-charts` or bump past 6.55.0 without
# re-reading #3400; the community chart is what's tracked for future
# upgrades (see the Renovate carve-out in .github/renovate.json5).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: loki
      version: 6.57.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community-charts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    deploymentMode: SingleBinary

    loki:
      # Homelab single-tenant Loki — no multi-tenant auth.
      auth_enabled: false

      commonConfig:
        # SingleBinary with 1 replica cannot satisfy the default RF=3.
        replication_factor: 1

      # TSDB schema v13 — mandated by the ACs and the current Loki default.
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
        s3:
          endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
          region: us-east-1
          s3ForcePathStyle: true
          # In-cluster plaintext HTTP to the SeaweedFS S3 gateway; TLS is
          # not configured on that endpoint. Not "insecure" in the internet
          # sense — this is intra-cluster traffic.
          insecure: true
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are injected via
          # singleBinary.extraEnvFrom below — Loki's S3 client reads them
          # natively, so no plaintext creds land in the ConfigMap.

      # THE critical block: this is what makes retention actually run.
      # The previous loki-stack failure mode (#2734, #3347) was configuring
      # retention_period without ever enabling the compactor.
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: s3

      limits_config:
        # Bounded retention -- 7 days (168h).
        retention_period: 168h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true

        # --- Phase 3 guardrails (#3347) ---
        # Bound per-stream and total ingestion so a single misbehaving
        # stream (e.g. a chatty pod with an unstable label, or a log-line
        # loop) cannot exhaust the SeaweedFS bucket before anyone notices.
        # These are deliberately generous for a single homelab node running
        # Alloy on ~a dozen namespaces, not defaults copied from a
        # multi-tenant SaaS deployment -- the point is a ceiling, not a
        # tight budget.
        #
        # ingestion_rate_mb / ingestion_burst_size_mb: sustained/burst
        # ingest rate across the whole tenant. 8 MB/s sustained, 16 MB/s
        # burst is generous headroom over current usage (~477MB received
        # total since deploy) while still capping a runaway logger well
        # below "fill the disk".
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16

        # per_stream_rate_limit(_burst): caps a single stream (unique
        # label set) so one noisy pod can't monopolise the tenant-wide
        # budget above. 4 MB/s per stream is half the tenant budget --
        # generous for any one workload's normal log volume, but low
        # enough that a single crash-looping pod hits discards (visible in
        # loki_discarded_bytes_total) instead of silently consuming all
        # ingestion headroom.
        per_stream_rate_limit: 4MB
        per_stream_rate_limit_burst: 8MB

        # max_global_streams_per_user: with the curated Alloy label set
        # (namespace/app/pod/container/level), stream count is roughly
        # (running pods) x (containers) x (log levels seen) -- low
        # hundreds for this cluster. 5000 gives headroom for redeploys /
        # rolling restarts (old + new pod streams coexist briefly) without
        # allowing unbounded label-cardinality blowup to create endless
        # new streams.
        max_global_streams_per_user: 5000

    singleBinary:
      replicas: 1
      # Inject SeaweedFS S3 credentials. Loki's S3 client reads
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment,
      # keeping creds out of the ConfigMap and out of Git plaintext.
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      # Hotfix (#3347 Phase 1 follow-up): the "loki" S3 bucket does not
      # exist in SeaweedFS. Loki's startup/readiness GETs/lists the bucket
      # before it ever writes, so it hits 404 NoSuchBucket and never becomes
      # Ready -- which means it never issues the PUT that would otherwise
      # let SeaweedFS auto-create the bucket. This initContainer breaks that
      # deadlock by idempotently creating the bucket first. `mc mb
      # --ignore-existing` is a no-op when the bucket already exists, so
      # restarts/reschedules never crash-loop on it. Reuses the existing
      # loki-s3-credentials secret -- no new credentials introduced.
      initContainers:
        - name: bootstrap-s3-bucket
          image: minio/mc:RELEASE.2024-11-21T17-21-54Z@sha256:993e8c454a7ec632923f7e3e61adf1d473261da6354cefd641aedd33a2cfe112
          command:
            - sh
            - -c
            - |
              set -eu
              mc alias set seaweedfs "$MC_HOST_URL" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              mc mb --ignore-existing seaweedfs/loki
          env:
            - name: MC_HOST_URL
              value: http://seaweedfs-s3.seaweedfs.svc:8333
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: loki-s3-credentials
          # Mount the chart's built-in tmp emptyDir so mc can write config to /tmp/.mc
          # (chart v6.55.0 defines tmp as an emptyDir in the StatefulSet spec.volumes)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      persistence:
        enabled: true
        size: 10Gi
        storageClass: longhorn
      # Phase 3 (#3347): bounded envelope for a single-binary Loki on
      # homelab log volume. Requests are sized for steady-state (WAL
      # flush + TSDB index writes + occasional Explore queries); the
      # memory limit gives headroom above steady-state for query bursts
      # and compactor runs without leaving so much slack that a genuine
      # leak/runaway goes unnoticed. No CPU limit -- CPU is throttled
      # (compressible), so limiting it only slows query/compaction bursts
      # for no OOM-prevention benefit; the memory limit is the guardrail
      # that matters here. Coordinator validates via a 24h soak (no
      # OOMKills) post-merge.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Disable the built-in gateway (nginx in front of Loki). We hit Loki
    # directly from Grafana on the ClusterIP service.
    gateway:
      enabled: false

    # Disable memcached-backed caches; the homelab volume doesn't justify
    # the extra pods. Revisit if query latency becomes a problem.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # SingleBinary mode — zero out every SSD/distributed component so the
    # chart doesn't render StatefulSets/Deployments for read/write/backend
    # or the individual microservice targets.
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    distributor:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    indexGateway:
      replicas: 0
    compactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    patternIngester:
      replicas: 0

    monitoring:
      # Enable the chart's own ServiceMonitor — kube-prometheus-stack runs
      # with nil selectors so it picks this up cluster-wide (see the repo's
      # existing convention for ServiceMonitor discovery).
      serviceMonitor:
        enabled: true
        metricsInstance:
          # Deprecated Grafana Agent Operator integration; not used here.
          enabled: false
      # Disable the deprecated self-monitoring stack (Grafana Agent Operator,
      # loki-canary). We use Alloy for log collection (Phase 2) and don't
      # need the chart's own self-monitoring bundle.
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false
      # No chart-shipped dashboards or rules — those are handled elsewhere.
      dashboards:
        enabled: false
      rules:
        enabled: false

    lokiCanary:
      enabled: false

    test:
      enabled: false
