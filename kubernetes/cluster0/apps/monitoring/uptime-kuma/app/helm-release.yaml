---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: louislam/uptime-kuma
              tag: "2.2.1@sha256:7337368a77873f159435de9ef09567f68c31285ed5f951dec36256c4b267ee44"
            env:
              TZ: "${TIMEZONE}"
              UPTIME_KUMA_PORT: 3001
              UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: 0
          # oauth2-proxy sidecar — sits in front of uptime-kuma and handles
          # the full Google OAuth flow. Traefik routes to this container,
          # which proxies authenticated requests to uptime-kuma on localhost.
          oauth2-proxy:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.2@sha256:aa0bd8dd5ab0c78e4c91c92755ad573a5f92241f88138b4141b8ec803463b4fd
            args:
              - --provider=google
              - --provider-display-name=Google Workspace
              - --email-domain=${SECRET_PUBLIC_DOMAIN}
              - --upstream=http://localhost:3001
              - --http-address=0.0.0.0:4180
              - --redirect-url=https://uptime.${SECRET_PUBLIC_DOMAIN}/oauth2/callback
              - --set-xauthrequest=true
              - --cookie-secure=true
              - --cookie-httponly=true
              - --cookie-samesite=lax
              - --cookie-domain=.${SECRET_PUBLIC_DOMAIN}
              - --whitelist-domain=.${SECRET_PUBLIC_DOMAIN}
              - --reverse-proxy=true
              - --skip-provider-button=true
            env:
              OAUTH2_PROXY_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: oauth2-proxy-secrets
                    key: client-id
              OAUTH2_PROXY_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: oauth2-proxy-secrets
                    key: client-secret
              OAUTH2_PROXY_COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: oauth2-proxy-secrets
                    key: cookie-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: main
        ports:
          http:
            port: &port 4180
    route:
      app:
        hostnames: ["uptime.${SECRET_PUBLIC_DOMAIN}"]
        parentRefs:
          - name: traefik-gateway
            namespace: networking
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: pvc-uptime-kuma
        advancedMounts:
          main:
            app:
              - path: /app/data
