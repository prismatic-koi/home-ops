---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.0.22@sha256:914f529386804c8278a4e581526b9be5e1604df44b30daabc70aa97dcefe5268
            env:
              TZ: "${TIMEZONE}"
    service:
      app:
        controller: main
        ports:
          http:
            port: 1883
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-monitoring-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
              ports:
                - port: 1883
                  protocol: TCP
      allow-home-assistant-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: home-assistant
              ports:
                - port: 1883
                  protocol: TCP
      allow-zigbee2mqtt-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: zigbee2mqtt
              ports:
                - port: 1883
                  protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
    configMaps:
      config:
        enabled: true
        data:
          mosquitto.conf: |
            listener 1883
            allow_anonymous true
            persistence false
            connection_messages false
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          main:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
