---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        pod:
          # mosquitto reads passwd only at start, and a subPath mount does not
          # update. A mosquitto-passwd change needs a pod restart.
          annotations:
            reloader.stakater.com/auto: "true"
          securityContext:
            fsGroup: 1883
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
            env:
              TZ: "${TIMEZONE}"
    service:
      app:
        controller: main
        ports:
          http:
            port: 1883
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-monitoring-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus-blackbox-exporter
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: uptime-kuma
              ports:
                - port: 1883
                  protocol: TCP
      allow-home-assistant-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: home-assistant
              ports:
                - port: 1883
                  protocol: TCP
      allow-zigbee2mqtt-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: zigbee2mqtt
              ports:
                - port: 1883
                  protocol: TCP
      allow-mqtt-recorder-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: mqtt-recorder
              ports:
                - port: 1883
                  protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
    configMaps:
      config:
        enabled: true
        data:
          mosquitto.conf: |
            listener 1883
            allow_anonymous false
            password_file /mosquitto/secret/passwd
            acl_file /mosquitto/config/acl
            persistence false
            connection_messages false
          # Every user in mosquitto-passwd needs a block in this ACL. mosquitto
          # denies all topics to a user that the ACL does not list, and it logs
          # no denial at the default log level.
          acl: |
            user homeassistant
            topic readwrite #

            user zigbee2mqtt
            topic readwrite #

            user mqtt-recorder
            topic read zigbee2mqtt/+/set
            topic read zigbee2mqtt/bridge/#
            topic deny zigbee2mqtt/bridge/response/backup
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          main:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
      passwd:
        type: secret
        name: mosquitto-passwd
        defaultMode: 0440
        advancedMounts:
          main:
            app:
              - path: /mosquitto/secret/passwd
                subPath: passwd
                readOnly: true
      acl:
        type: configMap
        name: mosquitto
        defaultMode: 0440
        advancedMounts:
          main:
            app:
              - path: /mosquitto/config/acl
                subPath: acl
                readOnly: true
