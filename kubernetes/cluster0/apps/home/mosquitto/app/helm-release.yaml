---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        pod:
          # The copy-auth init container copies passwd only at pod start. A
          # mosquitto-passwd change needs a pod restart.
          annotations:
            reloader.stakater.com/auto: "true"
          securityContext:
            fsGroup: 1883
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # mosquitto warns when it does not own passwd or acl. A Secret or
          # ConfigMap volume always sets owner root on its files. The copies
          # get owner 1883, the uid of this container, so no chown is necessary.
          # CAUTION: Do not replace the copy with a symlink. mosquitto 2.1.1
          # and later refuse a symlinked passwd or acl file.
          copy-auth:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                install -m 0400 /src/passwd /mosquitto/auth/passwd
                install -m 0400 /src/acl /mosquitto/auth/acl
            securityContext:
              runAsNonRoot: true
              runAsUser: 1883
              runAsGroup: 1883
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
            env:
              TZ: "${TIMEZONE}"
    service:
      app:
        controller: main
        ports:
          http:
            port: 1883
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-monitoring-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus-blackbox-exporter
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: uptime-kuma
              ports:
                - port: 1883
                  protocol: TCP
      allow-home-assistant-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: home-assistant
              ports:
                - port: 1883
                  protocol: TCP
      allow-zigbee2mqtt-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: zigbee2mqtt
              ports:
                - port: 1883
                  protocol: TCP
      allow-mqtt-recorder-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: mqtt-recorder
              ports:
                - port: 1883
                  protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
    configMaps:
      config:
        enabled: true
        data:
          mosquitto.conf: |
            listener 1883
            allow_anonymous false
            password_file /mosquitto/auth/passwd
            acl_file /mosquitto/auth/acl
            persistence false
            connection_messages false
          # Every user in mosquitto-passwd needs a block in this ACL. mosquitto
          # denies all topics to a user that the ACL does not list, and it logs
          # no denial at the default log level.
          #
          # A wrong ACL fails with no log line (#3898). After each ACL change,
          # do the active test:
          #   1. Send a command to a zigbee2mqtt device from Home Assistant.
          #      Make sure that the device changes state. Make sure that
          #      `{app="mqtt-recorder"} |= "/set "` in Loki shows the command.
          #   2. Run the recorder test publish below. Make sure that it prints
          #      `Not authorized`. The command reads the credentials from the
          #      options file that the recorder writes at start.
          #      kubectl -n home exec deploy/mqtt-recorder -- sh -c 'umask 077 && cp "$XDG_CONFIG_HOME/mosquitto_sub" "$XDG_CONFIG_HOME/mosquitto_pub" && mosquitto_pub -h mosquitto.home.svc.cluster.local -V mqttv5 -q 1 -t "zigbee2mqtt/acl-test/set" -m "{\"state\":\"ON\"}"'
          acl: |
            user homeassistant
            topic readwrite #

            user zigbee2mqtt
            topic readwrite #

            user mqtt-recorder
            topic read zigbee2mqtt/+/set
            topic read zigbee2mqtt/bridge/#
            topic deny zigbee2mqtt/bridge/response/backup
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          main:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
      # Keep defaultMode 0440 on passwd and acl. copy-auth reads them through
      # group 1883 from fsGroup, and mode 0400 locks it out.
      # CAUTION: Generate each passwd line with the eclipse-mosquitto image of
      # the running version. Before you commit, run the salt-length check on
      # the decrypted file: the base64 salt of each $6$ or $7$ line must
      # decode to 12 or 64 bytes. mosquitto 2.1 does not start if one line
      # does not decode, and Reloader restarts the broker after each change
      # to mosquitto-passwd. So one bad line stops every MQTT client.
      passwd:
        type: secret
        name: mosquitto-passwd
        defaultMode: 0440
        advancedMounts:
          main:
            copy-auth:
              - path: /src/passwd
                subPath: passwd
                readOnly: true
      acl:
        type: configMap
        name: mosquitto
        defaultMode: 0440
        advancedMounts:
          main:
            copy-auth:
              - path: /src/acl
                subPath: acl
                readOnly: true
      # Memory medium: the passwd copy never touches the node disk.
      auth:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            copy-auth:
              - path: /mosquitto/auth
            app:
              - path: /mosquitto/auth
                readOnly: true
