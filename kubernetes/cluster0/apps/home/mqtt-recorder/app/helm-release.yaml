---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqtt-recorder
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
            env:
              XDG_CONFIG_HOME: /config
            envFrom:
              - secretRef:
                  name: mqtt-recorder
            # Keep the password out of argv. A -P argument shows in the
            # process command line. mosquitto_sub reads its default options
            # from $XDG_CONFIG_HOME/mosquitto_sub, and the heredoc writes that
            # file without a process argument.
            command: ["/bin/sh", "-c"]
            args:
              - |
                umask 077
                cat > "$XDG_CONFIG_HOME/mosquitto_sub" <<EOF
                -u $MQTT_USERNAME
                -P $MQTT_PASSWORD
                EOF
                # bridge/definitions is about 352 KB. Loki drops lines larger than 256 KB.
                exec mosquitto_sub -h mosquitto.home.svc.cluster.local -p 1883 -v \
                  -t 'zigbee2mqtt/+/set' \
                  -t 'zigbee2mqtt/bridge/#' \
                  -T 'zigbee2mqtt/bridge/logging' \
                  -T 'zigbee2mqtt/bridge/definitions' \
                  -T 'zigbee2mqtt/bridge/response/backup'  # The backup zip holds the Zigbee network key.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-mosquitto-egress:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 1883
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: mosquitto
    persistence:
      config:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        globalMounts:
          - path: /config
