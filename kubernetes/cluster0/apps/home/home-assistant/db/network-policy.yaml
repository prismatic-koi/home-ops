---
# Default deny-all for home-assistant-postgres-v18 CNPG cluster pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-default-deny
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS resolution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-dns
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# Allow intra-namespace primary <-> replica replication on :5432/:8000 (instance manager)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-replication
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: home-assistant-postgres-v18
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: home-assistant-postgres-v18
---
# Allow ingress from cloudnative-pg operator on :8000 (instance manager HTTP endpoint)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-operator-ingress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
          protocol: TCP
---
# Allow ingress from home/home-assistant on :5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-home-assistant-ingress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home
          podSelector:
            matchLabels:
              app.kubernetes.io/name: home-assistant
      ports:
        - port: 5432
          protocol: TCP
---
# Allow egress to seaweedfs-s3 on :8333 (WAL archiving)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-seaweedfs-s3-egress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
---
# Allow Prometheus to scrape postgres_exporter metrics on :9187
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-prometheus-scrape
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9187
          protocol: TCP
---
# Allow egress to Kubernetes API server (in-cluster service CIDR + control-plane CIDR)
# Required by CNPG instance-manager wait-for-get-cluster init step
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-postgres-v18-allow-k8s-api-egress
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: home-assistant-postgres-v18
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16  # K8s service CIDR (kubernetes.default.svc)
        - ipBlock:
            cidr: 10.87.42.0/24  # control-plane node CIDR
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
