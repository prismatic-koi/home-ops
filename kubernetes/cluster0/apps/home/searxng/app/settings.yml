general:
  debug: false
  enable_metrics: true

# fallthrough for things not set here
use_default_settings: true

search:
  safe_search: 0
  autocomplete: 'google'
  autocomplete_min: 4
  default_lang: 'en-NZ'
  formats:
    - html
    - json

server:
  secret_key: "i-dont-understand-why-this-is-needed"
  image_proxy: false
  method: GET
  # Bot protection stays off: #3555 withdrew the public DNS record, so no
  # path from the public internet remains. Two internal paths remain, and
  # both are network-gated. A tailnet client resolves through the headscale
  # split entry plus extra_records pin (#3553) and needs the
  # ben@ -> tag:ts-web ACL grant. A LAN client that is not on the tailnet
  # resolves through the blocky customDNS pin, which gates on the network
  # only, not on identity. Enable the limiter again if a public path returns.
  limiter: false

valkey:
  url: "valkey://searxng-valkey:6379"

ui:
  default_theme: simple
  query_in_title: true

# As of SearXNG 2025.10+, plugins are configured via a top-level `plugins:`
# map keyed by the plugin's fully-qualified class path. The previous
# `enabled_plugins:` list of friendly names is no longer parsed. Listing a
# plugin here with `active: true` enables it by default; unlisted plugins are
# not loaded (matching the old `enabled_plugins` opt-in semantics).
# Note: `infinite_scroll` is now controlled solely by its plugin (omitted
# below = not loaded, equivalent to the previous `ui.infinite_scroll: false`).
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true

categories_as_tabs:
  general:
  images:
  videos:
  news:
