---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret.sops.yaml has no metadata.namespace. This line puts its Secret in
# home, the namespace of the pod that reads it.
namespace: home
resources:
  - ./helm-release.yaml
  - ./secret.sops.yaml
  - ./probe.yaml
labels:
  - pairs:
      app.kubernetes.io/name: zigbee2mqtt
      app.kubernetes.io/instance: zigbee2mqtt

