---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.1@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
            env:
              TZ: "${TIMEZONE}"
              ZIGBEE2MQTT_DATA: /data
            securityContext:
              privileged: true
    service:
      app:
        controller: main
        ports:
          http:
            port: &port 8080
    route:
      app:
        labels:
          # Private DNS decision (#3519), not an omission. Off-LAN access is
          # tailnet-only by intent. The headscale split entry plus the
          # extra_records pin (#3609) are the only resolution path for this
          # hostname. Both must stay, or the hostname stops resolving. This
          # hostname gets no blocky customDNS pin: a pin is break-glass
          # bootstrap for infrastructure only (#3629).
          dns.home-ops/public: "false"
        hostnames: ["{{ .Release.Name }}.${SECRET_PUBLIC_DOMAIN}"]
        # Private listener only (#3617). The public listener serves no route
        # for this hostname, so a request to the public address returns 404,
        # whatever the client resolves. A tailnet client reaches it through
        # the ts-web proxy. A websecure entry here restores public
        # reachability.
        parentRefs:
          - name: traefik-gateway
            namespace: networking
            sectionName: websecurepriv
        # NO forwardauth-authelia middleware (#3633): access control is the
        # tailnet ACL (ben@ -> tag:ts-web in headscale policy.hujson). The
        # tailnet is the only path to this route. Restore the filter before
        # you bind this route to the public websecure listener again.
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    networkpolicies:
      default-deny:
        controller: main
        policyTypes: [Ingress, Egress]
        rules: {}
      allow-dns:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
      allow-traefik-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: networking
      allow-monitoring-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus-blackbox-exporter
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: uptime-kuma
              ports:
                - port: 8080
                  protocol: TCP
      allow-home-assistant-ingress:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: home-assistant
      allow-mosquitto-egress:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - ports:
                - port: 1883
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: home
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: mosquitto

    persistence:
      # config:
      #   enabled: true
      #   type: "custom"
      #   volumeSpec:
      #     configMap:
      #       name: zigbee2mqtt-settings
      #  advancedMounts:
      #    main:
      #      main:
      #        - path: /app/data/configuration.yaml"
      #          subPath: "configuration.yaml"
      data:
        existingClaim: pvc-zigbee2mqtt
        advancedMounts:
          main:
            app:
              - path: /data
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2490275-if00
        advancedMounts:
          main:
            app:
            - path: /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2490275-if00
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # note: label node like this 
            # kubectl label nodes k3s-agent5 app=zigbee-controller
            - matchExpressions:
              - key: app
                operator: In
                values:
                - zigbee-controller
