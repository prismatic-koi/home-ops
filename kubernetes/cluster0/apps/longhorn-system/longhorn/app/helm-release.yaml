---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultSettings:
      backupTarget: "nfs://${NAS0_IP}:/volume1/longhorn-backups"
      # Parallel rebuilds filled the 1 Gbit/s link of one node (#4161).
      concurrentReplicaRebuildPerNodeLimit: 2
    longhornUI:
      replicas: 3
    metrics:
      serviceMonitor:
        enabled: true
