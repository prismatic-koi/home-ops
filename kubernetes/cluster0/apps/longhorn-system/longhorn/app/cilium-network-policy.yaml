---
# =============================================================================
# Longhorn — CiliumNetworkPolicy companions for K8s API egress (Phase 4c,
# #2952). Authoritative under Cilium kubeProxyReplacement=true because the
# apiserver runs in the host network namespace and standard NetworkPolicy
# ipBlock matches are bypassed — see #2829 (external-dns) and #2947 (cnpg-
# operator) for the original investigation.
#
# Each policy mirrors a sibling NetworkPolicy in ./network-policy.yaml and
# selects the same pod label set.
# =============================================================================
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  egress:
    - toEntities:
        - kube-apiserver
---
# Admission-webhook ingress (#2976 follow-up) — see the matching
# NetworkPolicy `longhorn-admission-webhook-allow-apiserver` in
# ./network-policy.yaml for the full diagnosis. Authoritative half of the
# dual-policy pattern under Cilium kubeProxyReplacement=true: when the
# apiserver calls the validating/mutating webhooks on :9502 the source IP
# is on the host-network apiserver and standard NetworkPolicy ipBlock
# matches are bypassed (same identity quirk as #2829 / #2947).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-admission-webhook-allow-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      longhorn.io/admission-webhook: longhorn-admission-webhook
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9502"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-csi-plugin-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-csi-plugin
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-attacher-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: csi-attacher
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-provisioner-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: csi-provisioner
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-resizer-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: csi-resizer
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-snapshotter-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: csi-snapshotter
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-driver-deployer-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-driver-deployer
  egress:
    - toEntities:
        - kube-apiserver
---
# Recurring-job pods (#3060) — see the matching NetworkPolicy
# `longhorn-recurring-job-allow-k8s-api` in ./network-policy.yaml for the
# full rationale and selector justification.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-recurring-job-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchExpressions:
      - key: recurring-job.longhorn.io
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
---
# Helm hook Jobs (#3124) — see the matching NetworkPolicy
# `longhorn-helm-hook-allow-k8s-api` in ./network-policy.yaml for the full
# rationale, hook-pod labels, and selector justification. Same shape of
# regression as #3060.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-helm-hook-allow-kube-apiserver
  namespace: longhorn-system
spec:
  endpointSelector:
    matchExpressions:
      - key: job-name
        operator: In
        values:
          - longhorn-pre-upgrade
          - longhorn-post-upgrade
          - longhorn-uninstall
  egress:
    - toEntities:
        - kube-apiserver
