apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    # Private DNS decision (#3519), not an omission. This hostname is tier 3
    # (#3635): the websecurets listener serves it and nothing else does.
    # external-dns does not own this record, so "false" is inert for it and
    # only a manual Cloudflare delete withdraws the record (#3607). The
    # headscale split entry and the extra_records pin (#3677) are a pair, and
    # together they are the only resolution path for this hostname. There is
    # no blocky customDNS pin. Remove either half and no client resolves it.
    dns.home-ops/public: "false"
spec:
  hostnames:
    - longhorn.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    # Tier 3 (#3635): the websecurets listener alone. websecurets sits behind
    # traefik-ts, a ClusterIP Service with no LAN address, so the ts-web
    # tailnet proxy is the only path to this route. The public websecure
    # listener holds no route for this hostname, so a request to the public
    # address returns 404. There is no LAN-only tier any more (#3739), and
    # kubectl port-forward is the break-glass path (#3718). A websecure entry
    # restores public reachability -- restore the forwardauth-authelia filter
    # first.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  # NO forwardauth-authelia middleware. Access control is the headscale ACL
  # grant (ben@ -> tag:ts-web tcp:443 in policy.hujson), because the ts-web
  # tailnet proxy is the only path to this route. longhorn-frontend has no
  # authentication of its own, so restore the filter before you bind this route
  # to a listener that has a LAN or a public address.
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: longhorn-frontend
        namespace: longhorn-system
        port: 80
      matches:                                                                                                                                                                                                                                                  
      - path:                                                                                                                                                                                                                                                   
          type: PathPrefix                                                                                                                                                                                                                                      
          value: /
