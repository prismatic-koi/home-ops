---
# =============================================================================
# Longhorn — Phase 4c (#2952, parent design #2812)
#
# The wide intra-namespace allow below is a PERMANENT design choice, not a
# temporary state to be tightened later. Intra-namespace traffic within a
# single trust domain is not a meaningful security boundary; the real
# enforcement lives on the cross-namespace flows (Traefik → longhorn-ui
# ingress, K8s API egress, Prometheus scrape ingress, backup NFS egress,
# DNS egress) which are all tightly scoped below.
#
# Why intra-ns narrowing buys ~nothing here:
#   - All Longhorn pods are rendered by a single Helm release, share the
#     same SOPS-encrypted credentials, and run with storage-admin-equivalent
#     privileges by design.
#   - A compromised longhorn-ui can already reach longhorn-manager via the
#     official admin API on :9500.
#   - A compromised CSI sidecar already has cluster-wide volume-control
#     authority via its K8s API allow (Volume/VolumeAttachment CRDs).
#   - So per-pod intra-ns NetworkPolicy splits would only frustrate a future
#     reader without raising the bar for an attacker.
#
# Why intra-ns narrowing also has real downside:
#   - The data plane (instance-manager + engine processes) binds ephemeral
#     ports across the 10000-30000 range and re-allocates them as volumes
#     attach/detach. Per-port allows would silently drop replica traffic on
#     every re-allocation and risk volume corruption.
#
# Same shape of argument as the seaweedfs intra-ns widening in #2969:
# anything Helm renders in this namespace as part of the longhorn release is
# co-trusted with the data plane.
#
# See the parent design doc (#2812) and child issue (#2952) for the full
# Phase 4 context.
#
# Pod inventory (selectors used below):
#   - longhorn-manager     (DaemonSet)    — app=longhorn-manager
#   - longhorn-ui          (Deployment)   — app=longhorn-ui
#   - longhorn-driver-deployer (Deploy)   — app=longhorn-driver-deployer
#   - csi-attacher / -provisioner /
#     -resizer / -snapshotter (Deploys)   — app=csi-{attacher,provisioner,…}
#   - longhorn-csi-plugin  (DaemonSet)    — app=longhorn-csi-plugin
#   - instance-manager-*   (dynamic)      — longhorn.io/component=instance-manager
#   - engine-image-ei-*    (DaemonSet)    — longhorn.io/component=engine-image
#   - friday-backup-*      (Job pods from a CronJob; weekly backup) —
#                                           recurring-job.longhorn.io=friday-backup
#                                           Short-lived pod spawned by the
#                                           Longhorn recurring-job controller.
#                                           Despite being a "job" pod, it
#                                           runs the longhorn-manager binary
#                                           in `-d recurring-job` mode, which
#                                           does an initial K8s API call to
#                                           fetch the RecurringJob CR before
#                                           talking to longhorn-backend:9500
#                                           intra-ns. The intra-ns leg is
#                                           covered by the wide intra-ns
#                                           allow; the K8s API leg is covered
#                                           by the dedicated
#                                           `longhorn-recurring-job-allow-k8s-api`
#                                           rule below (added in #3060 after
#                                           the original #2952 classification
#                                           missed this egress).
#
# External flows (NOT covered by the wide intra-ns allow):
#   - DNS: every pod → CoreDNS :53 in kube-system
#   - K8s API egress: longhorn-manager, longhorn-csi-plugin, csi-*,
#     longhorn-driver-deployer, and recurring-job pods reconcile CRDs and
#     watch resources
#   - Traefik ingress: longhorn-ui :8000 from networking ns
#   - Prometheus scrape ingress: longhorn-manager :9500 (ServiceMonitor
#     `longhorn-prometheus-servicemonitor` selects app=longhorn-manager,
#     port name=manager → containerPort 9500)
#   - Admission-webhook ingress: longhorn-manager pods labelled
#     `longhorn.io/admission-webhook=longhorn-admission-webhook` serve the
#     validating + mutating admission webhooks on :9502; the apiserver
#     calls these for every Longhorn CRD write. Symmetric ingress
#     counterpart to the K8s API egress allows below — needs the same
#     dual-policy (NetworkPolicy + CiliumNetworkPolicy) treatment under
#     Cilium kubeProxyReplacement=true. Missed by #2976, added in this PR.
#   - Backup target NFS: instance-manager + longhorn-manager pods write the
#     Friday backup to nfs://${NAS0_IP}:/volume1/longhorn-backups
#     (NAS0 = 10.87.42.200 — same /24 as the nodes but NOT a node)
# =============================================================================
---
# -----------------------------------------------------------------------------
# Default-deny — applies to every pod in longhorn-system.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-default-deny
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# -----------------------------------------------------------------------------
# INTENTIONAL WIDE INTRA-NAMESPACE ALLOW — permanent design choice.
#
# Selects EVERY pod in longhorn-system (`podSelector: {}`) and allows BOTH
# ingress from and egress to every other pod in longhorn-system. This is one
# of the rare "intentional wide allow" cases in the netpol rollout (#2812,
# #2952) — see the top-of-file block for the full rationale.
#
# Summary: longhorn-system is a single trust domain. Every pod is rendered
# by the same Helm release, shares the same SOPS-encrypted credentials, and
# runs with storage-admin-equivalent privileges by design — a compromised
# longhorn-ui already has longhorn-manager admin API access on :9500, and a
# compromised CSI sidecar already has cluster-wide volume-control authority
# via its K8s API allow. Intra-ns NetworkPolicy splits inside this trust
# domain would not raise the bar for an attacker.
#
# The data plane separately makes narrowing technically risky: instance-
# manager and engine processes bind ephemeral ports across 10000-30000 and
# re-allocate them on every attach/detach. Per-port allows would silently
# drop replica traffic and risk volume corruption.
#
# Same shape of argument as the seaweedfs intra-ns widening in #2969:
# anything Helm renders in this namespace as part of the longhorn release
# is co-trusted with the data plane.
#
# The meaningful enforcement for this namespace is on the cross-namespace
# flows below (Traefik → longhorn-ui, K8s API egress, Prometheus scrape,
# backup NFS, DNS) — all tightly scoped.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-allow-intra-namespace
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
---
# -----------------------------------------------------------------------------
# DNS egress to CoreDNS in kube-system — applies to every pod.
#
# The wide intra-ns allow above does NOT cover DNS because CoreDNS lives in
# kube-system. Without this explicit cross-namespace rule no pod could
# resolve any name once the default-deny is in effect.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-allow-dns
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
---
# -----------------------------------------------------------------------------
# longhorn-ui — Traefik ingress on :8000 (pod containerPort named `http`;
# Service `longhorn-frontend` maps :80 → targetPort http).
#
# AND-shape: namespaceSelector (networking) + podSelector (Traefik) under a
# single from-entry.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-allow-traefik-ingress
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8000
          protocol: TCP
---
# -----------------------------------------------------------------------------
# longhorn-manager — Prometheus scrape ingress on :9500 (port name `manager`,
# matching ServiceMonitor `longhorn-prometheus-servicemonitor` which selects
# app=longhorn-manager and scrapes port name `manager`).
#
# AND-shape: monitoring ns + Prometheus pod selector.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-prometheus-scrape
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9500
          protocol: TCP
---
# -----------------------------------------------------------------------------
# longhorn admission webhook — apiserver ingress on :9502.
#
# This is the INGRESS counterpart to the K8s API egress allows below: when
# the apiserver invokes Longhorn's validating/mutating admission webhooks
# (Service `longhorn-admission-webhook`, port 9502, served by every
# longhorn-manager pod) the connection originates AT the apiserver, so it
# needs the same dual-policy treatment as the egress side under Cilium
# kubeProxyReplacement=true (#2829 / #2947).
#
# PR #2976 added the egress half (longhorn-manager → kube-apiserver) but
# missed this symmetric ingress. With default-deny in effect, apiserver →
# webhook calls fail on some nodes (per-agent BPF state asymmetry — failures
# were concentrated on the manager pods that re-attached to a particular
# subset of nodes after the 2026-05-22 rolling restart), which manifested
# as:
#   - ~100% timeouts on the BackupStoreTimer 5-min reconcile loop on
#     longhorn-manager pods on node1 (272/24h) and node2 (268/24h);
#     ~0 on node0/node3.
#   - 4 volumes failing admission on the 2026-06-04 weekly backup run with
#     `failed calling webhook "validator.longhorn.io": context deadline
#     exceeded` (10s timeout).
#   - 2 LonghornBackupMissed alerts firing in Prometheus
#     (pvc-zigbee2mqtt, pvc-jellyfin) — these clear naturally after the
#     next successful backup of those volumes once the webhook path is
#     healthy.
#
# Pod selector matches the live `longhorn-admission-webhook` Service
# selector (`longhorn.io/admission-webhook=longhorn-admission-webhook`),
# so the policy scope is exactly the webhook backends.
#
# Dual-policy pattern: standard NetworkPolicy ipBlock (defence-in-depth) +
# sibling CiliumNetworkPolicy `fromEntities: [kube-apiserver]`
# (authoritative under Cilium kubeProxyReplacement=true).
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-admission-webhook-allow-apiserver
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      longhorn.io/admission-webhook: longhorn-admission-webhook
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.87.42.2/32  # control plane node (defence-in-depth; CiliumNP is authoritative)
      ports:
        - port: 9502
          protocol: TCP
---
# -----------------------------------------------------------------------------
# K8s API egress — longhorn-manager.
#
# longhorn-manager is the control plane: it watches CRDs (Volume, Engine,
# Replica, BackingImage, RecurringJob, etc.), updates status, creates/deletes
# instance-manager pods, and runs the admission + recovery-backend
# controllers. Talks to the apiserver constantly.
#
# Dual-policy pattern: standard NetworkPolicy ipBlock (defence-in-depth) +
# sibling CiliumNetworkPolicy `toEntities: [kube-apiserver]` (authoritative
# under Cilium kubeProxyReplacement=true — see #2829 / #2947).
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16  # Service CIDR (kubernetes.default.svc)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32  # control plane node (defence-in-depth)
---
# -----------------------------------------------------------------------------
# K8s API egress — longhorn-csi-plugin (DaemonSet).
#
# longhorn-csi-plugin runs the CSI node-plugin sidecars (driver-registrar,
# liveness-probe, csi-plugin) and watches Node/VolumeAttachment for mount
# coordination. Needs apiserver access for the node-registrar handshake.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-csi-plugin-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-csi-plugin
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16  # Service CIDR
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32  # control plane node
---
# -----------------------------------------------------------------------------
# K8s API egress — csi-attacher / csi-provisioner / csi-resizer /
# csi-snapshotter (the external CSI sidecars, each a Deployment with 3
# replicas). Each watches a distinct CRD set (VolumeAttachment, PVC,
# VolumeSnapshot, etc.) and patches status back via the apiserver.
#
# One NetworkPolicy per sidecar app label so a regression on one doesn't
# silently affect the others.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-attacher-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: csi-attacher
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-provisioner-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: csi-provisioner
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-resizer-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: csi-resizer
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-snapshotter-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: csi-snapshotter
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32
---
# -----------------------------------------------------------------------------
# K8s API egress — longhorn-driver-deployer.
#
# Bootstraps the CSI driver registration; touches the apiserver to create the
# CSIDriver object and the CSI sidecar Deployments at startup. Small, but a
# default-deny without this would block first-boot reconciliation.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-driver-deployer-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-driver-deployer
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32
---
# -----------------------------------------------------------------------------
# K8s API egress — recurring-job pods (#3060).
#
# Longhorn's recurring-job controller spawns a short-lived pod (e.g.
# friday-backup-*) that runs the longhorn-manager binary in
# `-d recurring-job` mode. Before it talks to longhorn-backend:9500
# intra-ns, it does an initial K8s API call to fetch the RecurringJob CR
# (GET /apis/longhorn.io/v1beta2/namespaces/longhorn-system/recurringjobs/<name>).
# Without this rule that call hits the default-deny, times out after ~30s,
# the controller exits 0 without bubbling up the error, and the job
# silently produces no backups — exactly the regression #3060 fixes.
#
# Selector: `recurring-job.longhorn.io` with the Exists operator. This is
# scoped precisely to recurring-job pods only. The simpler
# `longhorn.io/managed-by: longhorn-manager` label is too broad — it also
# matches every instance-manager pod, which already has its own scoped NFS
# egress and does not need K8s API access. Using Exists (rather than the
# exact value `friday-backup`) also covers any future recurring-job tasks
# (snapshot, filesystem-trim, etc.) without further netpol changes.
#
# Dual-policy pattern: standard NetworkPolicy ipBlock (defence-in-depth) +
# sibling CiliumNetworkPolicy `toEntities: [kube-apiserver]` (authoritative
# under Cilium kubeProxyReplacement=true — see #2829 / #2947).
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-recurring-job-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchExpressions:
      - key: recurring-job.longhorn.io
        operator: Exists
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16  # Service CIDR (kubernetes.default.svc)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32  # control plane node (defence-in-depth)
---
# -----------------------------------------------------------------------------
# K8s API egress — Helm hook Jobs (pre-upgrade, post-upgrade, uninstall)
# (#3124).
#
# The Longhorn chart ships three Helm hook Jobs — `longhorn-pre-upgrade`,
# `longhorn-post-upgrade`, and `longhorn-uninstall` — each of which spawns a
# one-shot pod that runs the longhorn-manager binary in upgrade/uninstall
# mode. Before doing any in-namespace work the pods query the kube-apiserver
# for the current Longhorn version setting:
#
#   GET /apis/longhorn.io/v1beta2/namespaces/longhorn-system/settings/current-longhorn-version
#
# Without K8s API egress that call hits the default-deny and times out
# (`dial tcp 10.43.0.1:443: connect: connection timed out`), the hook
# fails, Helm fails the release, and Flux rolls the chart upgrade back.
# This was the root cause of the 1.11.2 → 1.12.0 attempt in PR #3106
# failing and being reverted in PR #3122 — until this rule lands every
# Longhorn chart upgrade will fail the same way.
#
# Hook pods carry these labels (and notably NOT `app: longhorn-manager`,
# which is why the existing per-component allow rules above don't match
# them):
#   app.kubernetes.io/name: longhorn
#   job-name: longhorn-pre-upgrade  # or -post-upgrade / -uninstall
#   helm.sh/chart: longhorn-1.12.0
#
# Selector uses `matchExpressions` with `In` over the three exact
# `job-name` values (rather than the `Exists` operator the recurring-job
# rule above uses) so the rule does not unintentionally widen apiserver
# egress to every Job-spawned pod in the namespace.
#
# Same shape of regression as #3060 (recurring-job pods missed by the
# original #2952 classification because they only exist briefly during
# specific control-plane operations rather than steady-state) — see that
# issue for the precedent.
#
# Dual-policy pattern: standard NetworkPolicy ipBlock (defence-in-depth) +
# sibling CiliumNetworkPolicy `toEntities: [kube-apiserver]` (authoritative
# under Cilium kubeProxyReplacement=true — see #2829 / #2947).
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-helm-hook-allow-k8s-api
  namespace: longhorn-system
spec:
  podSelector:
    matchExpressions:
      - key: job-name
        operator: In
        values:
          - longhorn-pre-upgrade
          - longhorn-post-upgrade
          - longhorn-uninstall
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.0/16  # Service CIDR (kubernetes.default.svc)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.87.42.2/32  # control plane node (defence-in-depth)
---
# -----------------------------------------------------------------------------
# NFS backup egress — longhorn-manager + instance-manager pods write the
# weekly backup to nfs://${NAS0_IP}:/volume1/longhorn-backups (NAS0 =
# 10.87.42.200, sits in the node /24 but is NOT a node and so not covered by
# any node-network entity allow). NFSv4 uses :2049 TCP; NFSv3 also opens
# rpcbind :111 + mountd. The backup target is configured for NFSv4 in this
# cluster (Longhorn defaults), but rpcbind :111 is allowed defensively to
# cover mount negotiation.
#
# Scoped to the two pod kinds that actually do the I/O:
#   - app=longhorn-manager        (DaemonSet, orchestrates the backup)
#   - longhorn.io/component=instance-manager (streams the volume data)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-allow-backup-nfs-egress
  namespace: longhorn-system
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [longhorn-manager]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.87.42.200/32  # ${NAS0_IP} — backup target NFS server
      ports:
        - port: 2049
          protocol: TCP
        - port: 111
          protocol: TCP
        - port: 111
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-instance-manager-allow-backup-nfs-egress
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      longhorn.io/component: instance-manager
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.87.42.200/32  # ${NAS0_IP} — backup target NFS server
      ports:
        - port: 2049
          protocol: TCP
        - port: 111
          protocol: TCP
        - port: 111
          protocol: UDP
