---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-console
  namespace: seaweedfs
  labels:
    # Public DNS opt-in (#3518). Removing this withdraws public DNS for the
    # hostname — pair it with internal resolution. See AGENTS.md.
    dns.home-ops/public: "true"
spec:
  hostnames:
    - seaweedfs.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecure
    # Tier-3 dual-bind (#3664, step 1 of #3607). Additive: the route is served
    # on the tailnet-only websecurets listener as well as websecure. Unbinding
    # from websecure is step 2. See AGENTS.md "Three exposure tiers".
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: networking
      sectionName: websecurets
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: seaweedfs-filer
          namespace: seaweedfs
          port: 8888
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /
