---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs
      version: 4.26.0
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: seaweedfs
      interval: 5m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      seaweedfs:
        enableSecurity: false

    master:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: emptyDir

    volume:
      replicas: 2
      dataDirs:
        - name: data
          type: persistentVolumeClaim
          size: 50Gi
          storageClass: longhorn
          maxVolumes: 0
      logs:
        type: emptyDir

    filer:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: emptyDir
      s3:
        enabled: true
        enableAuth: true

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
      replicas: 1
      logs:
        type: emptyDir
