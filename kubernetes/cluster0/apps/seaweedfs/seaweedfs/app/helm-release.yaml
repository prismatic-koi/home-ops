---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs
      version: 4.47.0
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: seaweedfs
      interval: 5m
  install:
    disableWait: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      seaweedfs:
        enableSecurity: false
        # Enable volume-server replication at the SW layer. `enableReplication`
        # gates whether `replicationPlacement` is applied; at chart v4.28.0 the
        # master/filer statefulset templates only pass -defaultReplication=<...>
        # from the global value when this flag is true (otherwise they fall back
        # to master.defaultReplication, which defaults to "000"). See #3052.
        # `001` = one extra copy on a different volume server (same DC, same
        # rack — we have no DC/rack topology). Satisfiable with the existing
        # 2 volume servers.
        enableReplication: true
        replicationPlacement: "001"
        # Render chart-native ServiceMonitors for master/volume/filer/s3 so
        # kube-prometheus-stack scrapes the :9327 /metrics endpoints. See #3051.
        monitoring:
          enabled: true

    master:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: emptyDir

    volume:
      replicas: 2
      dataDirs:
        - name: data
          type: persistentVolumeClaim
          size: 50Gi
          storageClass: longhorn
          maxVolumes: 0
      logs:
        type: emptyDir

    filer:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: emptyDir
      # Auto-restart the filer StatefulSet on seaweedfs-s3-config secret
      # rotation — avoids the manual bounce Phase 1 (#3348) needed when the
      # `loki` S3 identity was added. See Phase 2 note on #3347.
      podAnnotations:
        reloader.stakater.com/auto: "true"
      s3:
        enabled: true
        enableAuth: true
        existingConfigSecret: seaweedfs-s3-config

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
      replicas: 1
      logs:
        type: emptyDir
      # Same as filer.podAnnotations above — auto-restart the s3 Deployment
      # on seaweedfs-s3-config secret rotation.
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Pre-create the "loki" bucket (#3798). SeaweedFS makes a bucket on the
      # first PUT, but Loki LISTs the bucket during startup before it writes,
      # hits 404 NoSuchBucket, and never becomes Ready — so it never issues
      # the PUT that would create the bucket. This chart hook breaks that
      # deadlock with no extra image and no S3 CLI: the chart renders a
      # post-install/post-upgrade Job on the `chrislusf/seaweedfs` image
      # (the same image master/volume/filer/s3 already run) that calls
      # `weed shell s3.bucket.create`. It lists buckets first and skips an
      # existing one, so a restart or reschedule never crash-loops. This
      # replaces the old S3-CLI initContainer on the Loki StatefulSet (#3798).
      createBuckets:
        - name: loki
