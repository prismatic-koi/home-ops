---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Local

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flux Local - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            kubernetes/**/*
            .github/workflows/flux-local.yaml

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Test
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: "0.6.5"

      - name: Run flate test
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The install step exports FLATE_BASE=main into every later step's
          # environment (for changed-only mode). This job checks out a single
          # branch at default depth, so no origin/main ref exists on disk and
          # flate fails to resolve it. A plain `test` needs no base — only
          # `diff` does — so the fix is to stop FLATE_BASE reaching this step,
          # not to fetch full history.
          FLATE_BASE: ""
        run: flate test all --path kubernetes/cluster0/flux

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - helmrelease
          - kustomization
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: "0.6.5"

      - name: Run flate diff
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The install step exports FLATE_BASE=main into every later step, for
          # its git-rev changed-only mode. This job supplies the baseline a
          # different way: the `default/` checkout of the default branch, passed
          # as --path-orig. flate treats --base and --path-orig as mutually
          # exclusive, so FLATE_BASE must be cleared here or flate errors with
          # "--path-orig and --base are mutually exclusive". The diff still has a
          # base -- it is the `default/` tree, not a rev -- so this is NOT the
          # "no base needed" case that the test/lint steps clear FLATE_BASE for.
          FLATE_BASE: ""
        # Flag map from the retired flux-local diff:
        #   --path / --path-orig       -> same (changed-only mode; the baseline).
        #   --strip-attrs "a,b,c"      -> repeatable --strip-attr (flate default
        #                                 set kept explicit; `checksum/` is a
        #                                 prefix so it covers old `checksum/config`).
        #   --output-file diff.patch   -> stdout redirect.
        #   --all-namespaces           -> flate default (every namespace).
        # No flate equivalent (named in the PR description):
        #   --unified 6                -> flate diff context width is fixed.
        #   --limit-bytes 10000        -> reproduced in the next step by byte
        #                                 truncation against GitHub's comment cap.
        #   --sources home-ops-cluster0-> flate discovers the single source under
        #                                 --path; this repo has one.
        run: |-
          flate diff ${{ matrix.resource }} \
            --no-progress \
            --path pull/kubernetes/cluster0/flux \
            --path-orig default/kubernetes/cluster0/flux \
            --strip-attr helm.sh/chart \
            --strip-attr checksum/ \
            --strip-attr app.kubernetes.io/version \
            --strip-attr chart \
            --output github > diff.patch

      - name: Generate Diff
        id: diff
        run: |-
          # GitHub rejects a PR comment body over 65536 characters. Truncate the
          # rendered diff below that, leaving headroom for the ```diff fences and
          # the truncation notice, and state in-band that it was truncated. This
          # replaces flux-local's --limit-bytes flag, which flate does not have.
          MAX_BYTES=60000
          if [ -f diff.patch ] && [ "$(wc -c < diff.patch)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" diff.patch > diff.patch.tmp
            printf '\n... diff truncated: exceeded %s bytes (GitHub comment limit)\n' "$MAX_BYTES" >> diff.patch.tmp
            mv diff.patch.tmp diff.patch
          fi

          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          cat diff.patch 2>/dev/null >> $GITHUB_OUTPUT || true
          echo 'EOF' >> $GITHUB_OUTPUT

          # A change is present when flate wrote any non-whitespace output. In
          # changed-only mode flate emits nothing when no Kustomization or
          # HelmRelease differs, so an empty (or whitespace-only) file means no
          # diff and no comment. This reads flate's own output; it does not grep
          # for any flux-local marker text.
          if [ -f diff.patch ] && [ -n "$(tr -d '[:space:]' < diff.patch)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - if: ${{ steps.diff.outputs.diff != '' && steps.diff.outputs.has_changes == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          message: |-
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - diff
    name: Flux Local - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
